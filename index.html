<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meine Spots</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a7cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spots">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
/* Layout: Vollbild-Satellitenkarte, Glas-Panel links (Handy: ziehbares Bottom-Sheet), Steuerung oben rechts */
:root{
  --page:#1b1d1f; --glass:rgba(249,249,251,.86); --solid:#ffffff;
  --fg:#1c1c1e; --muted:#6c6c74; --line:rgba(60,60,67,.13);
  --fill:rgba(118,118,128,.12); --accent:#0a7cff; --accent-fg:#ffffff;
  --danger:#e5484d; --park:#2b6cb0;
  --shadow:0 10px 30px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.1);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(30,30,33,.84); --solid:#2c2c2e;
  --fg:#f2f2f7; --muted:#9d9da6; --line:rgba(235,235,245,.12);
  --fill:rgba(118,118,128,.26); --accent:#3c95ff;
  --danger:#ff6369; --park:#5a9be8;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --glass:rgba(30,30,33,.84); --solid:#2c2c2e;
  --fg:#f2f2f7; --muted:#9d9da6; --line:rgba(235,235,245,.12);
  --fill:rgba(118,118,128,.26); --accent:#3c95ff;
  --danger:#ff6369; --park:#5a9be8;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:absolute;inset:0;background:var(--page)}
#map.placing canvas{cursor:crosshair!important}

.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow);border:1px solid var(--line)}
.press{transition:transform .18s var(--ease),background-color .2s,opacity .2s}
.press:active{transform:scale(.96)}

/* ---------- Panel ---------- */
#panel{position:absolute;z-index:10;top:12px;left:12px;width:352px;max-height:calc(100% - 24px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.view{display:flex;flex-direction:column;min-height:0;flex:1}
.view.enter{animation:viewin .32s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.ph{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grabwrap{display:none}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em}
h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;flex:none}
.icon-btn.accent{background:var(--accent);color:var(--accent-fg)}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:11px;padding:0 10px;height:38px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;color:var(--fg);font-size:16px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:var(--solid);font-size:13px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s,transform .18s var(--ease)}
.chip:active{transform:scale(.95)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--fg);color:var(--glass);border-color:var(--fg)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .n{color:inherit;opacity:.7}

.pb{overflow-y:auto;flex:1;min-height:0;padding:6px 8px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:12px;transition:background-color .15s}
.item:hover{background:var(--fill)}
.item:active{background:var(--fill)}
.item .ic{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.item .tx{min-width:0;flex:1}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .me-d{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.tag-p{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:var(--park);color:#fff;font-size:10px;font-weight:800;vertical-align:-2px;margin-right:3px}
.empty{padding:22px 12px;color:var(--muted);text-align:center;line-height:1.5}
.empty b{color:var(--fg);display:block;margin-bottom:4px}

.pf{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);padding:6px 8px;border-radius:8px;font-size:13.5px}
.link:hover{background:var(--fill)}

/* Detail / Bearbeiten */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0}
.pad{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.badge{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:600;font-size:13px}
.badge .ic{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.notes{margin:0;white-space:pre-wrap;line-height:1.5}
.card{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:8px;font-weight:600}
.pmark{width:22px;height:22px;border-radius:6px;background:var(--park);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:17px}
.stats span{color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:12.5px}
.coords{display:flex;align-items:center;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:42px;border-radius:12px;border:0;background:var(--fill);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);padding:0 12px;transition:transform .18s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.park{background:var(--park);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.txtbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:2px}
.txtbtn.bold{font-weight:700}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:11px;padding:10px 12px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
textarea.inp{resize:vertical;min-height:68px;line-height:1.4}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.err{color:var(--danger);font-size:13px;text-transform:none;letter-spacing:0;font-weight:500}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick .chip.on{background:var(--c);border-color:var(--c);color:#fff}
.catpick .chip.on .dot{background:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.toggle span{font-weight:500}
.toggle small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--fill);position:relative;flex:none;transition:background .25s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.sw:checked{background:#34c759}
.sw:checked::after{transform:translateX(20px)}

.mode{padding:16px;display:flex;flex-direction:column;gap:12px}
.mode .big{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* ---------- Steuerung ---------- */
#ctrl{position:absolute;z-index:5;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stack{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.stack button{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;color:var(--fg);transition:color .2s,background-color .2s}
.stack button:active{background:var(--fill)}
.stack button+button{border-top:1px solid var(--line)}
.stack button.on{color:var(--accent)}

#near{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:46px;padding:0 15px 0 7px;border-radius:23px;max-width:calc(100% - 140px);color:var(--fg);text-align:left;transition:opacity .3s,transform .3s var(--ease)}
#near:active{transform:translateX(-50%) scale(.97)}
#near .ic{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
#near .tx{min-width:0;display:flex;flex-direction:column;line-height:1.2}
#near .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#near .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#near .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;margin-left:auto;padding-left:6px}
@media (min-width:641px){#near{left:calc(50% + 182px)}}

/* MapLibre-Steuerelemente im Glas-Look */
.maplibregl-ctrl-top-right{top:100px}
.maplibregl-ctrl-top-right .maplibregl-ctrl{margin:0 12px 0 0}
.maplibregl-ctrl-group{background:var(--glass)!important;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:12px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{width:42px!important;height:42px!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-scale{background:var(--glass);border-color:var(--fg);color:var(--fg)}

/* ---------- Marker ---------- */
.mk-spot{width:34px;height:41px;cursor:pointer}
.mk-spot .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);transform-origin:50% 50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .3s var(--ease)}
.mk-spot .pin svg{transform:rotate(45deg);color:#fff}
.mk-spot.sel .pin{transform:rotate(-45deg) scale(1.22)}
.mk-spot.new .pin,.mk-park.new .pk{animation:drop .5s var(--ease) both}
@keyframes drop{from{opacity:0;translate:0 -14px}}
.mk-spot.draft .pin{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -4px}}
.mk-park{cursor:pointer}
.mk-park .pk{width:24px;height:24px;border-radius:7px;background:var(--park);color:#fff;border:2px solid #fff;font:800 13px/20px var(--font);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.mk-park.sel .pk,.mk-park.draft .pk{transform:scale(1.15)}
.me{width:40px;height:40px;display:grid;place-items:center;pointer-events:none}
.me .p{grid-area:1/1;width:40px;height:40px;border-radius:50%;background:rgba(10,124,255,.35);animation:mepulse 2.2s ease-out infinite}
.me .d{grid-area:1/1;width:20px;height:20px;border-radius:50%;background:#0a7cff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
@keyframes mepulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}

/* ---------- Modal & Hinweise ---------- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.dlg{width:100%;max-width:420px;max-height:85vh;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;background:var(--solid);box-shadow:var(--shadow);animation:viewin .3s var(--ease)}
.dlg .pad{padding:14px 16px 16px}
.catrow{display:flex;align-items:center;gap:8px}
.catrow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;flex:none;cursor:pointer}
.catrow .inp{padding:7px 10px;font-size:15px}
.iconsel{display:flex;gap:4px;flex-wrap:wrap}
.iconsel button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted)}
.iconsel button.on{background:var(--c);color:#fff;border-color:var(--c)}
.catblock{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;z-index:50;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;animation:toastin .35s var(--ease)}
@keyframes toastin{from{opacity:0;translate:0 10px}}
#tilewarn{position:absolute;z-index:8;left:50%;top:40%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
#tilewarn strong{font-size:16px}

/* ---------- Handy: ziehbares Sheet ---------- */
@media (max-width:640px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:none;height:calc(100% - 52px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .5s var(--ease);will-change:transform;touch-action:none}
  #panel.dragging{transition:none}
  #panel.full .pb,#panel.full .pad{touch-action:pan-y}
  #panel:not(.full) .pb,#panel:not(.full) .pad{overflow:hidden}
  .ph,.top,.grabwrap{user-select:none;-webkit-user-select:none}
  .grabwrap{display:flex;justify-content:center;padding:7px 0 0;margin-bottom:-4px}
  .grab{width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 22%,transparent);border:0;padding:0}
  .ph{padding-top:8px}
  .chips{touch-action:pan-x}
  #ctrl{top:calc(10px + env(safe-area-inset-top,0px));right:10px}
  .maplibregl-ctrl-top-right{top:calc(104px + env(safe-area-inset-top,0px))}
  .maplibregl-ctrl-top-right .maplibregl-ctrl{margin-right:10px}
  .maplibregl-ctrl-bottom-right{bottom:auto;top:calc(196px + env(safe-area-inset-top,0px))}
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0 10px 0 0}
  .maplibregl-ctrl-scale{display:none}
  #near{top:calc(10px + env(safe-area-inset-top,0px));left:10px;transform:none;max-width:calc(100% - 76px)}
  #near:active{transform:scale(.97)}
  #toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Karte"></div>

<div id="ctrl">
  <div class="stack glass">
    <button id="b-labels" title="Straßen und Orte einblenden" aria-label="Beschriftung ein/aus"></button>
    <button id="b-locate" title="Mein Standort" aria-label="Mein Standort"></button>
  </div>
</div>

<button id="near" class="glass" hidden aria-live="polite"></button>

<aside id="panel" class="glass">
  <div class="grabwrap"><button class="grab" id="grab" aria-label="Panel auf- oder zuklappen"></button></div>
  <section class="view" id="listView">
    <div class="ph">
      <div class="row between">
        <h1>Meine Spots</h1>
        <button class="icon-btn accent press" id="addBtn" aria-label="Spot hinzufügen" title="Spot hinzufügen"></button>
      </div>
      <div class="search"><span id="searchIc"></span><input id="q" type="search" placeholder="Spots oder Orte suchen" autocomplete="off" enterkeyhint="search"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="pb" id="listBody"></div>
    <div class="pf">
      <button class="link" id="catsBtn">Kategorien</button>
      <button class="link" id="exportBtn">Exportieren</button>
      <button class="link" id="importBtn">Importieren</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </section>
  <section class="view" id="detailView" hidden></section>
  <section class="view" id="editView" hidden></section>
  <section class="view" id="modeView" hidden></section>
</aside>

<div id="tilewarn" class="glass" hidden>
  <strong>Kartenbilder werden nicht geladen</strong>
  <span id="tilewarn-txt"></span>
</div>
<div id="modal" hidden></div>
<div id="toast" class="glass" hidden></div>

<script src="lib/maplibre-gl.js"></script>
<script>
(() => {
/* ================= Daten ================= */
const KEY = 'meine-spots-v1', PREF = 'meine-spots-prefs';
const ICONS = {
  mountain:'<path d="M3 19 9 9l4 6 3-4 5 8z"/>',
  camera:'<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  flag:'<path d="M6 21V4h11l-2 4 2 4H6"/>',
  waves:'<path d="M3 9c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 15c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/>',
  tent:'<path d="M3 20 12 4l9 16zM9.5 20 12 15l2.5 5"/>',
  food:'<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1.5-3 4-3 7h3"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>',
  tree:'<path d="M12 3 6 12h3l-3 5h12l-3-5h3zM12 17v4"/>',
  car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  drop:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
  pin:'<circle cx="12" cy="11" r="4"/>'
};
const UI = {

function dist(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m/10)*10} m` : m < 100000 ? `${(m/1000).toFixed(1).replace('.', ',')} km` : `${Math.round(m/1000)} km`;
const walkMin = m => Math.max(1, Math.round(m / 75)); // ~4,5 km/h
const fmtMin = n => n < 60 ? `${n} Min` : `${Math.floor(n/60)} h ${n%60} Min`;
const fmtCoord = p => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
const LL = p => [p.lng, p.lat];
function circlePoly(c, r, n = 48){
  const pts = [];
  for(let i = 0; i <= n; i++){
    const a = i / n * 2 * Math.PI;
    pts.push([c.lng + r * Math.cos(a) / (111320 * Math.cos(c.lat * Math.PI / 180)), c.lat + r * Math.sin(a) / 110540]);
  }
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[pts]}, properties:{}};
}
const FC = f => ({type:'FeatureCollection', features:f});

function upsert(key, kind, id, pos, html, sel, z){

/* ================= Panel / Sheet ================= */
const panel = $('#panel');
const mqMobile = matchMedia('(max-width:640px)');
const mobile = () => mqMobile.matches;
const SNAPS = ['peek', 'half', 'full'];
let snap = 'peek', sheetY = 0;

function peekVisible(){
  const head = view === 'list' ? $('#listView .ph') : null;
  const grab = $('.grabwrap').offsetHeight;
  const safe = parseFloat(getComputedStyle(panel).paddingBottom) || 0;
  return head ? grab + head.offsetHeight + safe : 150 + safe;
}
function snapY(name){
  const H = panel.offsetHeight;
  const vis = name === 'full' ? H : name === 'half' ? Math.min(H, Math.max(peekVisible() + 60, innerHeight * .5)) : peekVisible();
  return Math.max(0, H - vis);
}
function setSheetY(y, animate){
  sheetY = y;
  panel.classList.toggle('dragging', !animate);
  panel.style.transform = `translateY(${y}px)`;
}
function setSnap(name, animate = true){
  if(!mobile()) return;
  snap = name;
  panel.classList.toggle('full', name === 'full');
  setSheetY(snapY(name), animate);
}
function visibleSheet(){ return mobile() ? Math.max(0, panel.offsetHeight - sheetY) : 0; }
function camPad(){
  return mobile()
    ? {top:80, bottom:Math.min(visibleSheet(), innerHeight * .55) + 30, left:40, right:70}
    : {top:70, bottom:60, left:390, right:90};
}

/* Ziehen mit Schwung */
(() => {
  let start = null, dragging = false, moved = false, samples = [];
  panel.addEventListener('pointerdown', e => {
    if(!mobile() || e.button > 0) return;
    if(e.target.closest('input,textarea,select,.chips')) return;
    start = {x:e.clientX, y:e.clientY, sy:sheetY, id:e.pointerId, scroller:e.target.closest('.pb,.pad')};
    dragging = false; moved = false; samples = [{y:e.clientY, t:performance.now()}];
  });
  panel.addEventListener('pointermove', e => {
    if(!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if(!dragging){
      if(Math.abs(dy) < 7 || Math.abs(dy) < Math.abs(dx)) return;
      if(start.scroller && snap === 'full' && !(start.scroller.scrollTop <= 0 && dy > 0)){ start = null; return; }
      dragging = true; moved = true;
      try{ panel.setPointerCapture(e.pointerId); }catch(_){}
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    const H = panel.offsetHeight, maxY = H - Math.min(peekVisible(), 90);
    let y = start.sy + dy;
    if(y < 0) y = y / 3;                 // Gummiband oben
    if(y > maxY) y = maxY + (y - maxY) / 3;
    setSheetY(y, false);
    samples.push({y:e.clientY, t:performance.now()});
    if(samples.length > 5) samples.shift();
  });
  const end = e => {
    if(!start || (e && e.pointerId !== start.id)) return;
    if(dragging){
      const a = samples[0], b = samples[samples.length - 1];
      const v = (b.y - a.y) / Math.max(1, b.t - a.t); // px/ms, + = nach unten
      let idx;
      if(Math.abs(v) > .45) idx = SNAPS.indexOf(snap) + (v > 0 ? -1 : 1);
      else {
        let best = 0, bd = Infinity;
        SNAPS.forEach((n, i) => { const d = Math.abs(snapY(n) - sheetY); if(d < bd){ bd = d; best = i; } });
        idx = best;
      }
      setSnap(SNAPS[Math.max(0, Math.min(2, idx))]);
    }
    start = null; dragging = false;
  };
  panel.addEventListener('pointerup', end);
  panel.addEventListener('pointercancel', end);
  panel.addEventListener('click', e => { if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();
$('#grab').addEventListener('click', () => setSnap(snap === 'peek' ? 'half' : 'peek'));
mqMobile.addEventListener?.('change', () => { if(mobile()) setSnap(snap, false); else { panel.style.transform = ''; panel.classList.remove('full'); } });

}

function itemHTML(s){
  const cat = catById(s.cat);
  let sub = esc(cat.name);
  if(s.walk && s.parking) sub = `<span class="tag-p">P</span>${fmtDist(dist(s.parking, s))} zu Fuß · ` + sub;
  else if(s.walk) sub = 'Parkplatz fehlt · ' + sub;

  return `<button class="item" data-id="${s.id}"><span class="ic" style="--c:${cat.color}">${ic(cat.icon, 16)}</span><span class="tx"><span class="t">${esc(s.name)}</span><span class="s">${sub}</span></span></button>`;
}
function renderList(){
  const q = $('#q').value.trim().toLowerCase();
  const body = $('#listBody');
  if(!q){
    const list = visibleSpots().slice().sort(me ? (a,b) => dist(me, a) - dist(me, b) : (a,b) => (b.created||0) - (a.created||0));
    if(!data.spots.length) body.innerHTML = `<div class="empty"><b>Noch keine Spots</b>Tippe auf <strong>+</strong> und dann auf die Karte, um deinen ersten Spot zu setzen.</div>`;
    else if(!list.length) body.innerHTML = `<div class="empty">Keine Spots in dieser Kategorie.</div>`;
    else body.innerHTML = list.map(itemHTML).join('');
    return;
  }
  const own = data.spots.filter(s => (s.name + ' ' + (s.notes||'') + ' ' + catById(s.cat).name).toLowerCase().includes(q));
  let html = `<div class="sec">Deine Spots</div>` + (own.length ? own.map(itemHTML).join('') : `<div class="empty" style="padding:8px">Kein eigener Spot passt.</div>`);
  html += `<div class="sec">Orte</div>`;
  if(geoState === 'loading') html += `<div class="empty" style="padding:8px">Suche läuft …</div>`;
  else if(geoState === 'error') html += `<div class="empty" style="padding:8px">Ortssuche nicht erreichbar. Prüfe deine Internetverbindung.</div>`;
  else if(geoState === 'done' && !geoResults.length) html += `<div class="empty" style="padding:8px">Kein Ort gefunden.</div>`;
  else if(geoState === 'done') html += geoResults.map((r,i) => `<button class="item" data-geo="${i}"><span class="ic" style="--c:#8e8e93">${svg(UI.globe,16)}</span><span class="tx"><span class="t">${esc(r.name)}</span><span class="s">${esc(r.sub)}</span></span></button>`).join('');
  else html += `<button class="item" data-geosearch="1"><span class="ic" style="--c:var(--accent)">${svg(UI.search,16)}</span><span class="tx"><span class="t">„${esc($('#q').value.trim())}“ als Ort suchen</span><span class="s">oder Enter drücken</span></span></button>`;
  body.innerHTML = html;
}
let qTimer;
$('#q').addEventListener('input', () => { geoState = 'idle'; geoResults = []; clearTimeout(qTimer); qTimer = setTimeout(renderList, 80); });
$('#q').addEventListener('focus', () => setSnap('full'));
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); geoSearch(); } });
async function geoSearch(){
  const q = $('#q').value.trim(); if(!q) return;
  geoState = 'loading'; renderList();
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=${encodeURIComponent(q)}`);
    if(!r.ok) throw 0;
    geoResults = (await r.json()).map(x => {
      const parts = x.display_name.split(', ');
      return {name: x.name || parts[0], sub: parts.slice(1, 4).join(', '), lat:+x.lat, lng:+x.lon, bb:x.boundingbox};
    });
    geoState = 'done';
  }catch(e){ geoState = 'error'; }
  renderList();
}
$('#listBody').addEventListener('click', e => {
  const it = e.target.closest('button'); if(!it) return;
  if(it.dataset.id) return openDetail(it.dataset.id, true);
  if(it.dataset.geosearch) return geoSearch();
  if(it.dataset.geo != null){
    const r = geoResults[+it.dataset.geo];
    $('#q').blur(); setSnap('peek');
    setTimeout(() => {
      if(r.bb) map.fitBounds([[+r.bb[2], +r.bb[0]], [+r.bb[3], +r.bb[1]]], {padding:camPad(), maxZoom:16, duration:1400});
      else map.flyTo({center:[r.lng, r.lat], zoom:15, padding:camPad(), duration:1400});
    }, 60);
  }
});

function flyToSpot(s){

    const b = new maplibregl.LngLatBounds(LL(s), LL(s)).extend(LL(s.parking));

function navLinks(p, label){
  const ll = `${p.lat},${p.lng}`;
  return `<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener">${svg(UI.nav,15)}${label}</a>
          <a class="btn" href="https://maps.apple.com/?daddr=${ll}" target="_blank" rel="noopener">Apple Karten</a>`;
}
function renderDetail(s){
  const cat = catById(s.cat);
  let park = '';
  if(s.walk && s.parking){
    const d = dist(s.parking, s);
    park = `<div class="card">
      <div class="h"><span class="pmark">P</span>Parkplatz</div>
      <div class="stats"><div><b>${fmtDist(d)}</b><span>Luftlinie</span></div><div><b>ca. ${fmtMin(walkMin(d))}</b><span>zu Fuß</span></div></div>
      ${s.parking.note ? `<div>${esc(s.parking.note)}</div>` : ''}
      <div class="coords"><span>${fmtCoord(s.parking)}</span><button class="txtbtn" data-copy="${fmtCoord(s.parking)}">Kopieren</button></div>
      <div class="btns">${navLinks(s.parking, 'Zum Parkplatz')}</div>
    </div>`;
  } else if(s.walk){
    park = `<div class="card"><div class="h"><span class="pmark">P</span>Kein Parkplatz gesetzt</div><div class="muted">Bearbeite den Spot, um einen Parkplatz auf der Karte zu markieren.</div></div>`;
  }
  $('#detailView').innerHTML = `
    <div class="top"><button class="txtbtn" data-act="back">${svg(UI.back,14)} Spots</button><button class="icon-btn press" data-act="back" aria-label="Schließen">${svg(UI.close,14)}</button></div>
    <div class="pad">
      <div style="display:flex;flex-direction:column;gap:6px"><span class="badge" style="--c:${cat.color}"><span class="ic">${ic(cat.icon,13)}</span>${esc(cat.name)}</span><h2>${esc(s.name)}</h2></div>
      ${me ? `<div class="stats"><div><b>${fmtDist(dist(me, s))}</b><span>von dir entfernt (Luftlinie)</span></div></div>` : ''}
      ${s.notes ? `<p class="notes">${esc(s.notes)}</p>` : ''}
      ${park}
      <div class="card">
        <div class="h">${s.walk ? 'Spot' : 'Mit dem Auto erreichbar'}</div>
        <div class="coords"><span>${fmtCoord(s)}</span><button class="txtbtn" data-copy="${fmtCoord(s)}">Kopieren</button></div>
        ${s.walk ? '' : `<div class="btns">${navLinks(s, 'Navigation')}</div>`}
      </div>
      <div class="btns"><button class="btn" data-act="edit">Bearbeiten</button><button class="btn danger" data-act="del">Löschen</button></div>
    </div>`;
}
function closeDetail(){ selected = null; show('list', 'half'); renderMarkers(); }
$('#detailView').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.copy) return copy(b.dataset.copy);
  const a = b.dataset.act;
  if(a === 'back') closeDetail();
  if(a === 'edit') startEdit(selected);
  if(a === 'del'){
    if(delArmed === selected){
      const s = data.spots.find(x => x.id === selected);
      data.spots = data.spots.filter(x => x.id !== selected); save();
      selected = null; show('list', 'half'); refreshAll(); toast(`„${s.name}“ gelöscht`);
    } else {
      delArmed = selected; b.classList.add('armed'); b.textContent = 'Wirklich löschen?';
      setTimeout(() => { if(b.isConnected){ delArmed = null; b.classList.remove('armed'); b.textContent = 'Löschen'; } }, 3500);
    }
  }
});

/* ================= Platzieren ================= */
function enterMode(m){
  mode = m;
  $('#map').classList.add('placing');
  const txt = m === 'spot' ? 'Tippe auf die Karte, um den Spot zu setzen.' : 'Tippe auf die Karte, wo du parkst.';
  const tip = m === 'spot' ? 'Tipp: Reinzoomen für mehr Genauigkeit.' : 'Zum Beispiel Wanderparkplatz oder Straßenrand am Wegbeginn.';
  $('#modeView').innerHTML = `<div class="mode">
      <div class="big"><span class="pulse"></span>${txt}</div>
      <div class="muted">${tip}</div>
      <div class="btns"><button class="btn" data-act="cancel">Abbrechen</button><button class="btn primary" data-act="center">Kartenmitte nehmen</button></div>
    </div>`;
  show('mode', 'peek');
}
function exitMode(){ mode = null; $('#map').classList.remove('placing'); }
$('#modeView').addEventListener('click', e => {
  const a = e.target.closest('button')?.dataset.act;
  if(a === 'cancel'){
    const was = mode; exitMode();
    if(was === 'spot' && draft && draft.lat == null){ draft = null; renderDraftMarkers(); renderMarkers(); show(selected ? 'detail' : 'list', 'half'); }
    else showEdit();
  }
  if(a === 'center') place(map.getCenter());
});
map.on('click', e => {
  if(mode) return place(e.lngLat);
  if(view === 'detail') closeDetail();
  else if(mobile() && view === 'list' && snap !== 'peek'){ $('#q').blur(); setSnap('peek'); }
});
map.on('contextmenu', e => { if(!mode && view !== 'edit'){ newDraft(); place(e.lngLat); } });
function place(ll){
  const p = {lat:ll.lat, lng:ll.lng};
  if(mode === 'spot'){ draft.lat = p.lat; draft.lng = p.lng; }
  else if(mode === 'parking'){ draft.parking = {...p, note: draft.parking?.note || ''}; }
  exitMode(); showEdit();
}

/* ================= Bearbeiten ================= */
function newDraft(){
  const c = filter.size === 1 ? [...filter][0] : data.cats[0]?.id;
  draft = {id:uid(), isNew:true, name:'', cat:c, notes:'', lat:null, lng:null, walk:false, parking:null, created:Date.now()};
  selected = null; editError = '';
}
$('#addBtn').addEventListener('click', () => { newDraft(); renderMarkers(); enterMode('spot'); });
function startEdit(id){
  const s = data.spots.find(x => x.id === id); if(!s) return;
  draft = structuredClone(s); draft.isNew = false; editError = '';
  renderMarkers(); showEdit();
}
function showEdit(){ renderEdit(); show('edit', 'full'); renderDraftMarkers(); renderMarkers(); }
function syncForm(){
  const n = $('#f-name'); if(!n) return;
  draft.name = n.value; draft.notes = $('#f-notes').value;
  const pn = $('#f-pnote'); if(pn && draft.parking) draft.parking.note = pn.value;
}
function refreshEditLive(){ const sc = $('#editView .pad')?.scrollTop || 0; syncForm(); renderEdit(); const p = $('#editView .pad'); if(p) p.scrollTop = sc; }
function renderEdit(){
  const d = draft;
  let park = '';
  if(d.walk){
    if(d.parking){
      const m = dist(d.parking, d);
      park = `<div class="card">
        <div class="h"><span class="pmark">P</span>Parkplatz gesetzt</div>
        <div class="stats"><div><b>${fmtDist(m)}</b><span>Luftlinie</span></div><div><b>ca. ${fmtMin(walkMin(m))}</b><span>zu Fuß</span></div></div>
        <label class="f">Notiz zum Parkplatz<input class="inp" id="f-pnote" value="${esc(d.parking.note)}" placeholder="z. B. kostenlos, max. 2 h"></label>
        <div class="muted">Den P-Marker kannst du auf der Karte ziehen.</div>
        <div class="btns"><button class="btn" data-act="park">Neu setzen</button><button class="btn danger" data-act="unpark">Entfernen</button></div>
      </div>`;
    } else park = `<button class="btn park" data-act="park">${svg(UI.car,16)} Parkplatz auf Karte setzen</button>`;
  }
  $('#editView').innerHTML = `
    <div class="top"><button class="txtbtn" data-act="cancel">Abbrechen</button><strong>${d.isNew ? 'Neuer Spot' : 'Spot bearbeiten'}</strong><button class="txtbtn bold" data-act="save">Sichern</button></div>
    <div class="pad">
      <label class="f">Name<input class="inp" id="f-name" value="${esc(d.name)}" placeholder="z. B. Sonnenuntergang am Hang" maxlength="80">${editError ? `<span class="err">${editError}</span>` : ''}</label>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="f" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Kategorie</span>
        <div class="catpick">${data.cats.map(c => `<button type="button" class="chip ${c.id === d.cat ? 'on' : ''}" data-cat="${c.id}" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div>
      </div>
      <label class="f">Notiz<textarea class="inp" id="f-notes" rows="3" placeholder="Was macht den Spot aus? Beste Uhrzeit, Weg, …">${esc(d.notes)}</textarea></label>
      <div class="card"><div class="coords"><span>Position: ${fmtCoord(d)}</span><button class="txtbtn" data-act="move">Neu setzen</button></div><div class="muted">Oder den Marker auf der Karte ziehen.</div></div>
      <div class="toggle"><span>Nicht direkt mit dem Auto erreichbar<small>Dann markierst du, wo du parkst.</small></span><input type="checkbox" class="sw" id="f-walk" ${d.walk ? 'checked' : ''} aria-label="Nicht direkt mit dem Auto erreichbar"></div>
      ${park}
    </div>`;
}
$('#editView').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.cat){ syncForm(); draft.cat = b.dataset.cat; refreshEditLive(); renderDraftMarkers(); return; }
  const a = b.dataset.act;
  if(a === 'cancel'){ const back = draft.isNew ? null : draft.id; draft = null; renderDraftMarkers(); if(back) openDetail(back); else { show('list', 'half'); renderMarkers(); } }
  if(a === 'save') saveDraft();
  if(a === 'move'){ syncForm(); enterMode('spot'); }
  if(a === 'park'){ syncForm(); enterMode('parking'); }
  if(a === 'unpark'){ syncForm(); draft.parking = null; refreshEditLive(); renderDraftMarkers(); }
});
$('#editView').addEventListener('change', e => {
  if(e.target.id === 'f-walk'){ syncForm(); draft.walk = e.target.checked; refreshEditLive(); renderDraftMarkers(); }
});
function saveDraft(){
  syncForm();
  if(!draft.name.trim()){ editError = 'Gib dem Spot einen Namen.'; renderEdit(); $('#f-name').focus(); return; }
  const s = {...draft, name:draft.name.trim(), notes:draft.notes.trim()}; delete s.isNew;
  if(!s.walk) s.parking = null;
  if(s.parking) s.parking.note = (s.parking.note || '').trim();
  const i = data.spots.findIndex(x => x.id === s.id);
  if(i >= 0) data.spots[i] = s; else data.spots.push(s);
  if(filter.size && !filter.has(s.cat)) filter.add(s.cat);
  save(); draft = null; renderDraftMarkers(); refreshAll(); openDetail(s.id);
  toast(i >= 0 ? 'Gespeichert' : `„${s.name}“ hinzugefügt`);
}

/* ================= Kategorien ================= */
function openCats(){ renderCats(); $('#modal').hidden = false; }
function renderCats(){
  const used = {}; data.spots.forEach(s => used[s.cat] = (used[s.cat]||0) + 1);
  $('#modal').innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="Kategorien">
    <div class="top" style="padding:12px 14px"><strong style="font-size:17px">Kategorien</strong><button class="txtbtn bold" data-act="close">Fertig</button></div>
    <div class="pad" style="gap:0;padding-top:0">
      ${data.cats.map(c => `<div class="catblock" data-id="${c.id}" style="--c:${c.color}">
        <div class="catrow"><input type="color" value="${c.color}" data-k="color" aria-label="Farbe"><input class="inp" value="${esc(c.name)}" data-k="name" aria-label="Name" maxlength="30">
        <button class="icon-btn" data-act="delcat" title="${used[c.id] ? `Wird von ${used[c.id]} Spot(s) genutzt` : 'Löschen'}" ${used[c.id] ? 'disabled style="opacity:.35;cursor:default"' : ''} aria-label="Kategorie löschen">${svg(UI.close,13)}</button></div>
        <div class="iconsel">${Object.keys(ICONS).map(k => `<button class="${k === c.icon ? 'on' : ''}" data-icon="${k}" aria-label="Symbol ${k}">${ic(k,15)}</button>`).join('')}</div>
      </div>`).join('')}
      <button class="btn" style="margin-top:12px" data-act="addcat">${svg(UI.plus,14)} Kategorie hinzufügen</button>
      <div class="muted" style="margin-top:8px">Kategorien mit Spots lassen sich erst löschen, wenn keine Spots mehr darin sind.</div>
    </div></div>`;
}
$('#catsBtn').addEventListener('click', openCats);
$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal') return closeCats();
  const b = e.target.closest('button'); if(!b) return;
  const blk = b.closest('.catblock'), cat = blk && data.cats.find(c => c.id === blk.dataset.id);
  if(b.dataset.icon && cat){ cat.icon = b.dataset.icon; save(); renderCats(); return; }
  const a = b.dataset.act;
  if(a === 'close') closeCats();
  if(a === 'delcat' && cat){ data.cats = data.cats.filter(c => c !== cat); filter.delete(cat.id); save(); renderCats(); }
  if(a === 'addcat'){
    const pal = ['#0ca678','#f59f00','#ae3ec9','#4263eb','#e03131','#5c940d'];
    data.cats.push({id:uid(), name:'Neue Kategorie', color:pal[data.cats.length % pal.length], icon:'pin'}); save(); renderCats();
    const inputs = $('#modal').querySelectorAll('[data-k="name"]'); const last = inputs[inputs.length-1]; last.focus(); last.select();
  }
});
$('#modal').addEventListener('input', e => {
  const blk = e.target.closest('.catblock'); if(!blk) return;
  const cat = data.cats.find(c => c.id === blk.dataset.id);
  if(e.target.dataset.k === 'name') cat.name = e.target.value.trim() || 'Ohne Namen';
  if(e.target.dataset.k === 'color'){ cat.color = e.target.value; blk.style.setProperty('--c', cat.color); }
  save();
});
function closeCats(){ $('#modal').hidden = true; refreshAll(); if(view === 'detail' && selected) renderDetail(data.spots.find(s => s.id === selected)); if(view === 'edit') refreshEditLive(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#modal').hidden) closeCats(); });

/* ================= Export / Import ================= */
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({app:'meine-spots', version:1, exported:new Date().toISOString(), ...data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `meine-spots-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${data.spots.length} Spots exportiert`);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    if(!Array.isArray(j.spots)) throw 0;
    (j.cats || []).forEach(c => { if(c && c.id && !data.cats.some(x => x.id === c.id)) data.cats.push(c); });
    let n = 0;
    if(j.spots.some(s => s && !String(s.id).startsWith('bsp'))) data.spots = data.spots.filter(s => !String(s.id).startsWith('bsp'));
    j.spots.forEach(s => {
      if(!s || typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
      const i = data.spots.findIndex(x => x.id === s.id);
      if(i >= 0) data.spots[i] = s; else data.spots.push({...s, id: s.id || uid()});
      n++;
    });
    save(); refreshAll(); fitAll(); toast(`${n} Spots importiert`);
  }catch(err){ toast('Datei konnte nicht gelesen werden. Erwartet wird ein Export aus „Meine Spots“.'); }
});

/* ================= Standort (live) ================= */
let meMarker = null, watchId = null, centerOnFix = false, lastListPos = null;
function startGPS(center){
  if(!navigator.geolocation){ toast('Standort wird von diesem Browser nicht unterstützt.'); return; }
  centerOnFix = center;
  if(watchId != null){ if(center && me) map.flyTo({center:LL(me), zoom:Math.max(map.getZoom(), 15), padding:camPad(), duration:1200}); return; }
  if(center) toast('Standort wird ermittelt …');
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    if(center || err.code !== 1) toast(err.code === 1 ? 'Standortzugriff verweigert. Erlaube ihn in den Einstellungen für Safari/Chrome.' : 'Standort gerade nicht verfügbar.');
    prefs.gps = false; savePrefs();
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function onPos(p){
  me = {lat:p.coords.latitude, lng:p.coords.longitude};
  const acc = p.coords.accuracy || 0;
  if(!meMarker){
    const el = document.createElement('div'); el.className = 'me'; el.innerHTML = '<span class="p"></span><span class="d"></span>';
    meMarker = new maplibregl.Marker({element:el, anchor:'center'}).setLngLat(LL(me)).addTo(map);
  } else meMarker.setLngLat(LL(me));
  setSrc('acc', FC(acc > 5 ? [circlePoly(me, acc)] : []));
  $('#b-locate').classList.add('on');
  if(!prefs.gps){ prefs.gps = true; savePrefs(); }
  if(centerOnFix){ centerOnFix = false; hideToast(); map.flyTo({center:LL(me), zoom:Math.max(map.getZoom(), 15), padding:camPad(), duration:1400}); }
  renderNearest();
  if(!lastListPos || dist(lastListPos, me) > 25){
    lastListPos = me;
    if(view === 'list') renderList();
    if(view === 'detail' && selected){ const s = data.spots.find(x => x.id === selected); if(s){ const sc = $('#detailView .pad')?.scrollTop || 0; renderDetail(s); const pd = $('#detailView .pad'); if(pd) pd.scrollTop = sc; } }
  }
}
function renderNearest(){
  const el = $('#near');
  const list = visibleSpots();
  if(!me || !list.length){ el.hidden = true; return; }
  let best = null, bd = Infinity;
  for(const s of list){ const d = dist(me, s); if(d < bd){ bd = d; best = s; } }
  const cat = catById(best.cat);
  el.dataset.id = best.id;
  el.innerHTML = `<span class="ic" style="--c:${cat.color}">${ic(cat.icon,15)}</span><span class="tx"><span class="l">Nächster Spot</span><span class="t">${esc(best.name)}</span></span><span class="d">${fmtDist(bd)}</span>`;
  el.hidden = false;
}
$('#near').addEventListener('click', e => { const id = e.currentTarget.dataset.id; if(id && !mode && view !== 'edit') openDetail(id, true); });
$('#b-locate').addEventListener('click', () => startGPS(true));
$('#b-labels').addEventListener('click', () => { prefs.labels = !prefs.labels; savePrefs(); applyLabels(); });

/* ================= Helfer ================= */
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = true; void t.offsetWidth; t.hidden = false; clearTimeout(tt); tt = setTimeout(hideToast, 2800); }
function hideToast(){ $('#toast').hidden = true; }
function copy(text){
  const done = () => toast('Koordinaten kopiert');
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast(text); } ta.remove(); }
}
function refreshAll(){ renderChips(); renderList(); renderMarkers(); renderNearest(); }
function fitAll(animate){
  const pts = data.spots.flatMap(s => s.walk && s.parking ? [LL(s), LL(s.parking)] : [LL(s)]);
  if(!pts.length) return;
  const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  map.fitBounds(b, {padding:camPad(), maxZoom:14, duration: animate === false ? 0 : 1200});
}

/* ================= Start ================= */
$('#addBtn').innerHTML = svg(UI.plus, 16, 2.6);
$('#searchIc').innerHTML = svg(UI.search, 15);
$('#b-locate').innerHTML = svg(UI.locate, 18);
$('#b-labels').innerHTML = svg(UI.labels, 18);
applyLabels(); refreshAll();
if(mobile()) setSnap('peek', false);
requestAnimationFrame(() => fitAll(false));
(async () => {
  let granted = prefs.gps;
  try{ const st = await navigator.permissions?.query({name:'geolocation'}); if(st) granted = st.state === 'granted' || (st.state === 'prompt' && prefs.gps); }catch(e){}
  if(granted) startGPS(false);
})();
})();
</script>
</body>
