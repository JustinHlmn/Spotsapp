<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jamsis Spots</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a7cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spots">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
/* Layout: Vollbild-Satellitenkarte, Glas-Panel links (Handy: ziehbares Bottom-Sheet), Steuerung oben rechts */
:root{
  --page:#1b1d1f; --glass:rgba(249,249,251,.86); --solid:#ffffff;
  --fg:#1c1c1e; --muted:#6c6c74; --line:rgba(60,60,67,.13);
  --fill:rgba(118,118,128,.12); --accent:#0a7cff; --accent-fg:#ffffff;
  --danger:#e5484d; --park:#2b6cb0;
  --shadow:0 10px 30px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.1);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(30,30,33,.84); --solid:#2c2c2e;
  --fg:#f2f2f7; --muted:#9d9da6; --line:rgba(235,235,245,.12);
  --fill:rgba(118,118,128,.26); --accent:#3c95ff;
  --danger:#ff6369; --park:#5a9be8;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --glass:rgba(30,30,33,.84); --solid:#2c2c2e;
  --fg:#f2f2f7; --muted:#9d9da6; --line:rgba(235,235,245,.12);
  --fill:rgba(118,118,128,.26); --accent:#3c95ff;
  --danger:#ff6369; --park:#5a9be8;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:absolute;inset:0;background:var(--page)}
#map.placing canvas{cursor:crosshair!important}

.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow);border:1px solid var(--line)}
.press{transition:transform .18s var(--ease),background-color .2s,opacity .2s}
.press:active{transform:scale(.96)}

/* ---------- Panel ---------- */
#panel{position:absolute;z-index:10;top:12px;left:12px;width:352px;max-height:calc(100% - 24px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.view{display:flex;flex-direction:column;min-height:0;flex:1}
.view.enter{animation:viewin .32s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.ph{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grabwrap{display:none}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em}
h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;flex:none}
.icon-btn.accent{background:var(--accent);color:var(--accent-fg)}
.here-btn{height:32px;border-radius:16px;border:0;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;padding:0 12px 0 9px;white-space:nowrap}
.here-btn[disabled]{opacity:.6}
.tabs{display:flex;gap:16px;align-items:baseline}
.tabs button{border:0;background:none;padding:0;font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--muted);transition:color .2s}
.tabs button.on{color:var(--fg)}
.phbody{display:flex;flex-direction:column;gap:10px}
.rec-start{width:100%;height:46px;background:#ff3b30;color:#fff;font-size:15px}
.rec-start .rdot{width:10px;height:10px;border-radius:50%;background:#fff}
.reccard{display:flex;align-items:center;gap:10px;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
.reccard .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.reccard .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.reccard .sm{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.rb{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--fill);color:var(--fg);flex:none;transition:transform .18s var(--ease)}
.rb:active{transform:scale(.92)}
.rb.stop{background:#ff3b30;color:#fff}
.hint{color:var(--muted);font-size:12px;line-height:1.4}
.weak{color:#ff9f0a}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tstats div{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.tstats b{font-size:18px}
.tstats span{color:var(--muted);font-size:12px}
#recbar{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:26px;color:var(--fg)}
#recbar .dot{width:10px;height:10px;border-radius:50%;background:#ff3b30;flex:none;animation:recblink 1.4s ease-in-out infinite}
#recbar.paused .dot{background:var(--muted);animation:none}
#recbar .tx{display:flex;flex-direction:column;line-height:1.15;font-variant-numeric:tabular-nums;min-width:78px}
#recbar b{font-size:16px}
#recbar .tx span{font-size:12px;color:var(--muted)}
#recbar .rb{width:40px;height:40px}
@keyframes recblink{50%{opacity:.25}}
@media (min-width:641px){#recbar{left:calc(50% + 182px)}}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:11px;padding:0 10px;height:38px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;color:var(--fg);font-size:16px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:var(--solid);font-size:13px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s,transform .18s var(--ease)}
.chip:active{transform:scale(.95)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--fg);color:var(--glass);border-color:var(--fg)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .n{color:inherit;opacity:.7}

.pb{overflow-y:auto;flex:1;min-height:0;padding:6px 8px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:12px;transition:background-color .15s}
.item:hover{background:var(--fill)}
.item:active{background:var(--fill)}
.item .ic{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.item .tx{min-width:0;flex:1}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .me-d{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.tag-p{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:var(--park);color:#fff;font-size:10px;font-weight:800;vertical-align:-2px;margin-right:3px}
.empty{padding:22px 12px;color:var(--muted);text-align:center;line-height:1.5}
.empty b{color:var(--fg);display:block;margin-bottom:4px}

.pf{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);padding:6px 8px;border-radius:8px;font-size:13.5px}
.link:hover{background:var(--fill)}

/* Detail / Bearbeiten */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0}
.pad{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.badge{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:600;font-size:13px}
.badge .ic{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.notes{margin:0;white-space:pre-wrap;line-height:1.5}
.card{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:8px;font-weight:600}
.pmark{width:22px;height:22px;border-radius:6px;background:var(--park);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:17px}
.stats span{color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:12.5px}
.coords{display:flex;align-items:center;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:42px;border-radius:12px;border:0;background:var(--fill);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);padding:0 12px;transition:transform .18s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.park{background:var(--park);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.txtbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:2px}
.txtbtn.bold{font-weight:700}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:11px;padding:10px 12px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
textarea.inp{resize:vertical;min-height:68px;line-height:1.4}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.err{color:var(--danger);font-size:13px;text-transform:none;letter-spacing:0;font-weight:500}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick .chip.on{background:var(--c);border-color:var(--c);color:#fff}
.catpick .chip.on .dot{background:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.toggle span{font-weight:500}
.toggle small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--fill);position:relative;flex:none;transition:background .25s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.sw:checked{background:#34c759}
.sw:checked::after{transform:translateX(20px)}

.mode{padding:16px;display:flex;flex-direction:column;gap:12px}
.mode .big{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* ---------- Steuerung ---------- */
#ctrl{position:absolute;z-index:5;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stack{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.stack button{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;color:var(--fg);transition:color .2s,background-color .2s}
.stack button:active{background:var(--fill)}
.stack button+button{border-top:1px solid var(--line)}
.stack button.on{color:var(--accent)}

#near{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:46px;padding:0 15px 0 7px;border-radius:23px;max-width:calc(100% - 140px);color:var(--fg);text-align:left;transition:opacity .3s,transform .3s var(--ease)}
#near:active{transform:translateX(-50%) scale(.97)}
#near .ic{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
#near .tx{min-width:0;display:flex;flex-direction:column;line-height:1.2}
#near .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#near .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#near .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;margin-left:auto;padding-left:6px}
@media (min-width:641px){#near{left:calc(50% + 182px)}}

/* MapLibre-Steuerelemente im Glas-Look */
.maplibregl-ctrl-top-right{top:152px}
.maplibregl-ctrl-top-right .maplibregl-ctrl{margin:0 12px 0 0}
.maplibregl-ctrl-group{background:var(--glass)!important;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:12px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{width:42px!important;height:42px!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-scale{background:var(--glass);border-color:var(--fg);color:var(--fg)}

#attrib{position:absolute;z-index:4;right:12px;bottom:6px;font-size:9.5px;line-height:1.2;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
.maplibregl-ctrl-bottom-right{bottom:16px}

/* ---------- Marker ---------- */
.mk-spot{width:34px;height:41px;cursor:pointer}
.mk-spot .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);transform-origin:50% 50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .3s var(--ease)}
.mk-spot .pin svg{transform:rotate(45deg);color:#fff}
.mk-spot.sel .pin{transform:rotate(-45deg) scale(1.22)}
.mk-spot.new .pin,.mk-park.new .pk{animation:fadein .25s ease both}
.mk-spot.draft .pin{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -4px}}
.mk-park{cursor:pointer}
.mk-park .pk{width:24px;height:24px;border-radius:7px;background:var(--park);color:#fff;border:2px solid #fff;font:800 13px/20px var(--font);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.mk-park.sel .pk,.mk-park.draft .pk{transform:scale(1.15)}
.me{width:40px;height:40px;display:grid;place-items:center;pointer-events:none}
.me .p{grid-area:1/1;width:40px;height:40px;border-radius:50%;background:rgba(10,124,255,.35);animation:mepulse 2.2s ease-out infinite}
.me .d{grid-area:1/1;width:20px;height:20px;border-radius:50%;background:#0a7cff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
@keyframes mepulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}

.mk-cluster{display:grid;place-items:center;border-radius:50%;cursor:pointer;color:#1c1c1e;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s var(--ease)}
.mk-cluster:active{transform:scale(.94)}
.mk-cluster.new{animation:fadein .25s ease both}
.stack button.t3d{font:800 13px/1 var(--font);letter-spacing:.02em}

/* ---------- Startbildschirm ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 35%,#16314f 0%,#0b0d10 60%);color:#fff;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .logo{width:96px;height:96px;border-radius:24px;background:linear-gradient(180deg,#1e8cff,#0a6be0);display:grid;place-items:center;box-shadow:0 18px 40px rgba(10,124,255,.35);animation:logoin .7s var(--ease) both}
#splash .name{font-size:30px;font-weight:800;letter-spacing:-.02em;animation:textin .7s .12s var(--ease) both}
#splash .sub{font-size:14px;color:rgba(255,255,255,.6);margin-top:-10px;animation:textin .7s .22s var(--ease) both}
@keyframes logoin{from{opacity:0;transform:scale(.6) translateY(10px)}}
@keyframes textin{from{opacity:0;transform:translateY(10px)}}

/* ---------- Modal & Hinweise ---------- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.dlg{width:100%;max-width:420px;max-height:85vh;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;background:var(--solid);box-shadow:var(--shadow);animation:viewin .3s var(--ease)}
.dlg .pad{padding:14px 16px 16px}
.catrow{display:flex;align-items:center;gap:8px}
.catrow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;flex:none;cursor:pointer}
.catrow .inp{padding:7px 10px;font-size:15px}
.iconsel{display:flex;gap:4px;flex-wrap:wrap}
.iconsel button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted)}
.iconsel button.on{background:var(--c);color:#fff;border-color:var(--c)}
.catblock{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;z-index:50;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;animation:toastin .35s var(--ease)}
@keyframes toastin{from{opacity:0;translate:0 10px}}
#tilewarn{position:absolute;z-index:8;left:50%;top:40%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
#tilewarn strong{font-size:16px}

/* ---------- Handy: ziehbares Sheet ---------- */
@media (max-width:640px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:none;height:calc(100% - 52px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .5s var(--ease);will-change:transform;touch-action:none}
  #panel.dragging{transition:none}
  #panel.full .pb,#panel.full .pad{touch-action:pan-y}
  #panel:not(.full) .pb,#panel:not(.full) .pad{overflow:hidden}
  .ph,.top,.grabwrap{user-select:none;-webkit-user-select:none}
  .grabwrap{display:flex;justify-content:center;padding:7px 0 0;margin-bottom:-4px}
  .grab{width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 22%,transparent);border:0;padding:0}
  .ph{padding-top:8px}
  .chips{touch-action:pan-x}
  #ctrl{top:calc(10px + env(safe-area-inset-top,0px));right:10px}
  .maplibregl-ctrl-top-right{top:calc(148px + env(safe-area-inset-top,0px))}
  .maplibregl-ctrl-top-right .maplibregl-ctrl{margin-right:10px}
  #attrib{position:fixed;right:10px;bottom:0;transition:transform .5s var(--ease)}
  #attrib.dragging{transition:none}
  .maplibregl-ctrl-scale{display:none}
  #near{top:calc(10px + env(safe-area-inset-top,0px));left:10px;transform:none;max-width:calc(100% - 76px)}
  #recbar{top:calc(10px + env(safe-area-inset-top,0px));left:10px;transform:none}
  .tabs{gap:14px}
  .tabs button{font-size:21px}
  #near:active{transform:scale(.97)}
  #toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="logo"><svg viewBox="0 0 24 24" width="50" height="50" aria-hidden="true"><path d="M12 2.5c-4 0-7 3-7 7 0 5.2 7 12 7 12s7-6.8 7-12c0-4-3-7-7-7z" fill="#fff"/><circle cx="12" cy="9.5" r="2.8" fill="#0a7cff"/></svg></div>
  <div class="name">Jamsis Spots</div>
  <div class="sub">Lädt Satellitenbilder …</div>
</div>
<div id="map" aria-label="Karte"></div>
<div id="attrib">Bilder © Esri, Maxar, Earthstar Geographics · Höhen © Mapzen</div>

<div id="ctrl">
  <div class="stack glass">
    <button id="b-labels" title="Straßen und Orte einblenden" aria-label="Beschriftung ein/aus"></button>
    <button id="b-locate" title="Mein Standort" aria-label="Mein Standort"></button>
    <button id="b-3d" class="t3d" title="3D-Gelände" aria-label="3D-Gelände ein/aus">3D</button>
  </div>
</div>

<button id="near" class="glass" hidden aria-live="polite"></button>
<div id="recbar" class="glass" hidden>
  <span class="dot"></span>
  <div class="tx"><b data-rt>0:00</b><span data-rd>0 m</span></div>
  <button class="rb" data-rec="toggle" aria-label="Pause"></button>
  <button class="rb stop" data-rec="stop" aria-label="Aufzeichnung beenden"></button>
</div>

<aside id="panel" class="glass">
  <div class="grabwrap"><button class="grab" id="grab" aria-label="Panel auf- oder zuklappen"></button></div>
  <section class="view" id="listView">
    <div class="ph">
      <div class="row between">
        <div class="tabs" role="tablist"><button class="on" data-tab="spots" role="tab">Spots</button><button data-tab="tracks" role="tab">Strecken</button></div>
        <div class="row" id="spotActions"><button class="here-btn press" id="hereBtn" title="Spot an deinem aktuellen Standort speichern"></button><button class="icon-btn accent press" id="addBtn" aria-label="Spot auf der Karte setzen" title="Spot auf der Karte setzen"></button></div>
      </div>
      <div class="phbody" id="spotsHead">
        <div class="search"><span id="searchIc"></span><input id="q" type="search" placeholder="Spots oder Orte suchen" autocomplete="off" enterkeyhint="search"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="phbody" id="tracksHead" hidden></div>
    </div>
    <div class="pb" id="listBody"></div>
    <div class="pf">
      <button class="link" id="catsBtn">Kategorien</button>
      <button class="link" id="exportBtn">Exportieren</button>
      <button class="link" id="importBtn">Importieren</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </section>
  <section class="view" id="detailView" hidden></section>
  <section class="view" id="editView" hidden></section>
  <section class="view" id="modeView" hidden></section>
  <section class="view" id="trackView" hidden></section>
  <section class="view" id="trackSaveView" hidden></section>
</aside>

<div id="tilewarn" class="glass" hidden>
  <strong>Kartenbilder werden nicht geladen</strong>
  <span id="tilewarn-txt"></span>
</div>
<div id="modal" hidden></div>
<div id="toast" class="glass" hidden></div>

<script src="lib/maplibre-gl.js"></script>
<script>
(() => {
/* ================= Daten ================= */
const KEY = 'meine-spots-v1', PREF = 'meine-spots-prefs';
const ICONS = {
  mountain:'<path d="M3 19 9 9l4 6 3-4 5 8z"/>',
  camera:'<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  flag:'<path d="M6 21V4h11l-2 4 2 4H6"/>',
  waves:'<path d="M3 9c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 15c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/>',
  tent:'<path d="M3 20 12 4l9 16zM9.5 20 12 15l2.5 5"/>',
  food:'<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1.5-3 4-3 7h3"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>',
  tree:'<path d="M12 3 6 12h3l-3 5h12l-3-5h3zM12 17v4"/>',
  car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  drop:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
  pin:'<circle cx="12" cy="11" r="4"/>'
};
const UI = {
  plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
  route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/>',
  pause:'<path d="M8.5 5v14M15.5 5v14"/>', play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',
  stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  locate:'<path d="M3 11 21 3l-8 18-2-8z"/>', labels:'<path d="M5 7h14M12 7v12M8 19h8"/>',
  back:'<path d="M15 5 8 12l7 7"/>', close:'<path d="M6 6l12 12M18 6 6 18"/>',
  car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2"/>',
  nav:'<path d="M3 11 21 3l-8 18-2-8z"/>', globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'
};
const svg = (p, s = 16, w = 2.2) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = (name, s) => svg(ICONS[name] || ICONS.pin, s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);

const DEFAULT_CATS = [
  {id:'aussicht', name:'Aussicht',  color:'#f08c00', icon:'mountain'},
  {id:'foto',     name:'Fotospot',  color:'#d6336c', icon:'camera'},
  {id:'wandern',  name:'Wandern',   color:'#2f9e44', icon:'flag'},
  {id:'baden',    name:'Baden',     color:'#1c7ed6', icon:'waves'},
  {id:'camping',  name:'Camping',   color:'#7048e8', icon:'tent'},
  {id:'essen',    name:'Essen',     color:'#e8590c', icon:'food'},
  {id:'sonstiges',name:'Sonstiges', color:'#868e96', icon:'star'}
];
const SAMPLE = [
  {id:'bsp1', name:'Bastei-Aussicht', cat:'aussicht', notes:'Beispiel-Spot (Koordinaten ungefähr) – kannst du löschen.\nBlick über das Elbtal.', lat:50.9619, lng:14.0731, walk:true, parking:{lat:50.9659, lng:14.0682, note:'Parkplatz Bastei, gebührenpflichtig'}, created:Date.now()},
  {id:'bsp2', name:'Eibsee Nordufer', cat:'baden', notes:'Beispiel-Spot (Koordinaten ungefähr) – kannst du löschen.\nRuhige Bucht, früh morgens kommen.', lat:47.4603, lng:10.9745, walk:true, parking:{lat:47.4569, lng:10.9921, note:'Großer Parkplatz am Eibsee'}, created:Date.now()-1}
];

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.spots) && Array.isArray(d.cats)) return d; }
  }catch(e){}
  return {cats: structuredClone(DEFAULT_CATS), spots: structuredClone(SAMPLE)};
}
let data = load();
let storageOk = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ if(storageOk){ storageOk = false; toast('Speichern im Browser nicht möglich – nutze „Exportieren“ als Sicherung.'); } }
}
let prefs = {labels:true, gps:false, terrain:false};
try{ Object.assign(prefs, JSON.parse(localStorage.getItem(PREF) || '{}')); }catch(e){}
const savePrefs = () => { try{ localStorage.setItem(PREF, JSON.stringify(prefs)); }catch(e){} };
const catById = id => data.cats.find(c => c.id === id) || data.cats[data.cats.length - 1] || {id:'?', name:'Ohne', color:'#868e96', icon:'pin'};

/* ================= Geo ================= */
function dist(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m/10)*10} m` : m < 100000 ? `${(m/1000).toFixed(1).replace('.', ',')} km` : `${Math.round(m/1000)} km`;
const walkMin = m => Math.max(1, Math.round(m / 75)); // ~4,5 km/h
const fmtMin = n => n < 60 ? `${n} Min` : `${Math.floor(n/60)} h ${n%60} Min`;
const fmtCoord = p => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
const LL = p => [p.lng, p.lat];
function circlePoly(c, r, n = 48){
  const pts = [];
  for(let i = 0; i <= n; i++){
    const a = i / n * 2 * Math.PI;
    pts.push([c.lng + r * Math.cos(a) / (111320 * Math.cos(c.lat * Math.PI / 180)), c.lat + r * Math.sin(a) / 110540]);
  }
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[pts]}, properties:{}};
}
const FC = f => ({type:'FeatureCollection', features:f});

/* ================= Karte (MapLibre) ================= */
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const map = new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      sat:{type:'raster', tiles:[ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19, attribution:'Bilder © Esri, Maxar, Earthstar Geographics'},
      roads:{type:'raster', tiles:[ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19},
      places:{type:'raster', tiles:[ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19},
      dem:{type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding:'terrarium', tileSize:256, maxzoom:15, attribution:'Höhendaten © Mapzen, AWS Terrain Tiles'}
    },
    layers:[
      {id:'bg', type:'background', paint:{'background-color':'#1b1d1f'}},
      {id:'sat', type:'raster', source:'sat', paint:{'raster-fade-duration':250}},
      {id:'roads', type:'raster', source:'roads', paint:{'raster-opacity':.7, 'raster-fade-duration':250}},
      {id:'places', type:'raster', source:'places', paint:{'raster-fade-duration':250}}
    ]
  },
  center:[10.4, 51.1], zoom:5.2, maxZoom:20.5,
  attributionControl:false, pitchWithRotate:true, touchPitch:true,
  dragRotate:true, maxPitch:0, fadeDuration:150, renderWorldCopies:true
});
map.touchZoomRotate.enableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:true, visualizePitch:true}), 'top-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-right');

let mapReady = false;
const pendingSrc = {};
function setSrc(id, fc){
  if(!mapReady){ pendingSrc[id] = fc; return; }
  map.getSource(id)?.setData(fc);
}
map.on('load', () => {
  map.addSource('links', {type:'geojson', data:FC([])});
  map.addSource('draftlink', {type:'geojson', data:FC([])});
  map.addSource('acc', {type:'geojson', data:FC([])});
  map.addSource('spots', {type:'geojson', data:FC([]), cluster:true, clusterRadius:52, clusterMaxZoom:14});
  map.addLayer({id:'spots-q', type:'circle', source:'spots', paint:{'circle-radius':0, 'circle-opacity':0}});
  map.addLayer({id:'acc-fill', type:'fill', source:'acc', paint:{'fill-color':'#0a7cff', 'fill-opacity':.14}});
  map.addLayer({id:'acc-line', type:'line', source:'acc', paint:{'line-color':'#0a7cff', 'line-opacity':.5, 'line-width':1}});
  for(const id of ['track-all','track-view','track-live','track-ends']) map.addSource(id, {type:'geojson', data:FC([])});
  const rl = {'line-cap':'round', 'line-join':'round'};
  map.addLayer({id:'track-all-line', type:'line', source:'track-all', layout:rl, paint:{'line-color':'#ff9f0a', 'line-width':3, 'line-opacity':.6}});
  map.addLayer({id:'track-all-hit', type:'line', source:'track-all', layout:rl, paint:{'line-color':'#000', 'line-width':20, 'line-opacity':0}});
  map.addLayer({id:'track-view-case', type:'line', source:'track-view', layout:rl, paint:{'line-color':'#ffffff', 'line-width':8, 'line-opacity':.9}});
  map.addLayer({id:'track-view-line', type:'line', source:'track-view', layout:rl, paint:{'line-color':'#ff9f0a', 'line-width':5}});
  map.addLayer({id:'track-live-case', type:'line', source:'track-live', layout:rl, paint:{'line-color':'#ffffff', 'line-width':8, 'line-opacity':.9}});
  map.addLayer({id:'track-live-line', type:'line', source:'track-live', layout:rl, paint:{'line-color':'#ff3b30', 'line-width':5}});
  map.addLayer({id:'track-ends', type:'circle', source:'track-ends', paint:{'circle-radius':6.5, 'circle-color':['match', ['get','k'], 'start', '#30d158', '#ff3b30'], 'circle-stroke-color':'#ffffff', 'circle-stroke-width':2.5}});
  const lineLayout = {'line-cap':'round', 'line-join':'round'};
  map.addLayer({id:'links', type:'line', source:'links', layout:lineLayout, paint:{
    'line-color':['case', ['get','sel'], '#5cb0ff', '#ffffff'],
    'line-width':['case', ['get','sel'], 4.5, 3],
    'line-opacity':['case', ['get','sel'], 1, .7],
    'line-dasharray':[0.1, 2]}});
  map.addLayer({id:'draftlink', type:'line', source:'draftlink', layout:lineLayout, paint:{'line-color':'#5cb0ff', 'line-width':4.5, 'line-dasharray':[0.1, 2]}});
  mapReady = true;
  for(const id in pendingSrc) map.getSource(id)?.setData(pendingSrc[id]);
  applyLabels(); apply3D(false);
  updateTrackLayers(); drawLive();
  renderMarkers();
  hideSplash();
});
map.on('moveend', scheduleMarkers);
map.on('sourcedata', e => { if(e.sourceId === 'spots' && e.isSourceLoaded && !map.isMoving()) scheduleMarkers(); });

/* 3D-Gelände */
function apply3D(animate = true){
  $('#b-3d').classList.toggle('on', !!prefs.terrain);
  if(!mapReady) return;
  if(prefs.terrain){
    map.setMaxPitch(80);
    try{ map.setTerrain({source:'dem', exaggeration:1.4}); }catch(e){}
    try{ map.setSky && map.setSky({'sky-color':'#7fb2e6', 'horizon-color':'#cfe3f5', 'sky-horizon-blend':.6, 'horizon-fog-blend':.6, 'fog-color':'#cfe3f5', 'fog-ground-blend':.3}); }catch(e){}
    if(animate) map.easeTo({pitch:60, zoom:Math.max(map.getZoom(), 13), duration:1200});
  } else {
    const off = () => { try{ map.setTerrain(null); }catch(e){} map.setMaxPitch(0); };
    if(animate && map.getPitch() > 0){ map.easeTo({pitch:0, duration:900}); map.once('moveend', off); } else off();
  }
}
$('#b-3d').addEventListener('click', () => { prefs.terrain = !prefs.terrain; savePrefs(); apply3D(true); if(prefs.terrain) toast('3D an – mit zwei Fingern nach oben wischen zum Kippen'); });

/* Startbildschirm */
const splashStart = performance.now();
let splashGone = false;
function hideSplash(){
  if(splashGone) return; splashGone = true;
  const el = $('#splash'); if(!el) return;
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, Math.max(0, 900 - (performance.now() - splashStart)));
}
setTimeout(hideSplash, 3500);
function applyLabels(){
  if(mapReady) for(const l of ['roads','places']) map.setLayoutProperty(l, 'visibility', prefs.labels ? 'visible' : 'none');
  $('#b-labels').classList.toggle('on', prefs.labels);
}

/* Erkennen, wenn keine Kacheln laden */
let tilesOk = 0, tilesBad = 0;
map.on('data', e => { if(e.dataType === 'source' && e.sourceId === 'sat' && e.tile){ tilesOk++; $('#tilewarn').hidden = true; } });
map.on('error', e => {
  if(!(e.sourceId === 'sat' || e.source?.id === 'sat' || /arcgisonline/.test(String(e.error?.url || e.error?.message || '')))) return;
  if(++tilesBad >= 4 && tilesOk === 0){
    const inPreview = window.self !== window.top || location.protocol === 'blob:';
    $('#tilewarn-txt').textContent = inPreview
      ? 'Diese Vorschau blockiert Kartenbilder. Öffne die App direkt im Browser.'
      : 'Prüfe deine Internetverbindung. Firmennetze oder Werbeblocker können den Kartenserver (arcgisonline.com) sperren.';
    $('#tilewarn').hidden = false;
  }
});

/* ================= Zustand ================= */
let filter = new Set();
let selected = null;
let draft = null;
let mode = null;
let view = 'list';
let geoResults = [], geoState = 'idle';
let editError = '';
let me = null;
const visibleSpots = () => data.spots.filter(s => !filter.size || filter.has(s.cat));

/* ================= Marker ================= */
const markers = new Map();
function markerEl(kind, id){
  const el = document.createElement('div');
  el.className = (kind === 'spot' ? 'mk-spot' : 'mk-park') + ' new';
  el.dataset.id = id;
  el.addEventListener('animationend', () => el.classList.remove('new'), {once:true});
  el.addEventListener('click', e => { e.stopPropagation(); if(!mode && view !== 'edit') openDetail(id, true); });
  return el;
}
function upsert(key, kind, id, pos, html, sel, z){
  let m = markers.get(key);
  if(!m){
    const el = markerEl(kind, id);
    m = new maplibregl.Marker({element:el, anchor: kind === 'spot' ? 'bottom' : 'center'}).setLngLat(LL(pos)).addTo(map);
    markers.set(key, m);
  } else m.setLngLat(LL(pos));
  const el = m.getElement();
  if(el._html !== html){ el.innerHTML = html; el._html = html; }
  el.classList.toggle('sel', sel);
  el.style.zIndex = z;
}
function renderMarkers(){
  const feats = visibleSpots().filter(s => !(draft && draft.id === s.id))
    .map(s => ({type:'Feature', properties:{id:s.id}, geometry:{type:'Point', coordinates:LL(s)}}));
  if(mapReady) map.getSource('spots')?.setData(FC(feats));
  scheduleMarkers();
}
let markerQueued = false;
function scheduleMarkers(){
  if(markerQueued) return; markerQueued = true;
  requestAnimationFrame(() => { markerQueued = false; updateMarkers(); });
}
function updateMarkers(){
  if(!mapReady || !map.getSource('spots')) return;
  const want = new Set(), lines = [];
  const vis = new Set(visibleSpots().map(s => s.id));
  const feats = map.querySourceFeatures('spots');
  if(!feats.length && vis.size && map.getSource('spots') && !map.isSourceLoaded('spots')) return;
  for(const f of feats){
    const p = f.properties;
    if(p.cluster){
      const key = 'c:' + p.cluster_id;
      if(want.has(key)) continue; want.add(key);
      upsertCluster(key, p.cluster_id, f.geometry.coordinates, p.point_count);
    } else {
      const s = data.spots.find(x => x.id === p.id);
      if(!s || !vis.has(s.id) || want.has('s:' + s.id) || (draft && draft.id === s.id)) continue;
      const cat = catById(s.cat), sel = s.id === selected;
      want.add('s:' + s.id);
      upsert('s:' + s.id, 'spot', s.id, s, `<div class="pin" style="--c:${cat.color}">${ic(cat.icon, 16)}</div>`, sel, sel ? 4 : 2);
      if(s.walk && s.parking){
        want.add('p:' + s.id);
        upsert('p:' + s.id, 'park', s.id, s.parking, '<div class="pk">P</div>', sel, sel ? 3 : 1);
        lines.push({type:'Feature', properties:{sel}, geometry:{type:'LineString', coordinates:[LL(s.parking), LL(s)]}});
      }
    }
  }
  for(const [k, m] of markers) if(!want.has(k)){ m.remove(); markers.delete(k); }
  setSrc('links', FC(lines));
}
function upsertCluster(key, cid, coords, count){
  let m = markers.get(key);
  if(!m){
    const el = document.createElement('div');
    el.className = 'mk-cluster new';
    el.addEventListener('animationend', () => el.classList.remove('new'), {once:true});
    el.addEventListener('click', e => {
      e.stopPropagation();
      Promise.resolve(map.getSource('spots').getClusterExpansionZoom(cid))
        .then(z => map.easeTo({center:coords, zoom:Math.min((z || map.getZoom() + 2) + .4, 18), duration:800}))

/* ================= Panel / Sheet ================= */
const panel = $('#panel');
const mqMobile = matchMedia('(max-width:640px)');
const mobile = () => mqMobile.matches;
const SNAPS = ['peek', 'half', 'full'];
let snap = 'peek', sheetY = 0;

function peekVisible(){
  const head = view === 'list' ? $('#listView .ph') : null;
  const grab = $('.grabwrap').offsetHeight;
  const safe = parseFloat(getComputedStyle(panel).paddingBottom) || 0;
  return head ? grab + head.offsetHeight + safe : 150 + safe;
}
function snapY(name){
  const H = panel.offsetHeight;
  const vis = name === 'full' ? H : name === 'half' ? Math.min(H, Math.max(peekVisible() + 60, innerHeight * .5)) : peekVisible();
  return Math.max(0, H - vis);
}
function setSheetY(y, animate){
  sheetY = y;
  panel.classList.toggle('dragging', !animate);
  panel.style.transform = `translateY(${y}px)`;
  const at = $('#attrib');
  at.classList.toggle('dragging', !animate);
  at.style.transform = `translateY(${-(panel.offsetHeight - y) - 4}px)`;
}
function setSnap(name, animate = true){
  if(!mobile()) return;
  snap = name;
  panel.classList.toggle('full', name === 'full');
  setSheetY(snapY(name), animate);
}
function visibleSheet(){ return mobile() ? Math.max(0, panel.offsetHeight - sheetY) : 0; }
function camPad(){
  return mobile()
    ? {top:80, bottom:Math.min(visibleSheet(), innerHeight * .55) + 30, left:40, right:70}
    : {top:70, bottom:60, left:390, right:90};
}

/* Ziehen mit Schwung */
(() => {
  let start = null, dragging = false, moved = false, samples = [];
  panel.addEventListener('pointerdown', e => {
    if(!mobile() || e.button > 0) return;
    if(e.target.closest('input,textarea,select,.chips')) return;
    start = {x:e.clientX, y:e.clientY, sy:sheetY, id:e.pointerId, scroller:e.target.closest('.pb,.pad')};
    dragging = false; moved = false; samples = [{y:e.clientY, t:performance.now()}];
  });
  panel.addEventListener('pointermove', e => {
    if(!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if(!dragging){
      if(Math.abs(dy) < 7 || Math.abs(dy) < Math.abs(dx)) return;
      if(start.scroller && snap === 'full' && !(start.scroller.scrollTop <= 0 && dy > 0)){ start = null; return; }
      dragging = true; moved = true;
      try{ panel.setPointerCapture(e.pointerId); }catch(_){}
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    const H = panel.offsetHeight, maxY = H - Math.min(peekVisible(), 90);
    let y = start.sy + dy;
    if(y < 0) y = y / 3;                 // Gummiband oben
    if(y > maxY) y = maxY + (y - maxY) / 3;
    setSheetY(y, false);
    samples.push({y:e.clientY, t:performance.now()});
    if(samples.length > 5) samples.shift();
  });
  const end = e => {
    if(!start || (e && e.pointerId !== start.id)) return;
    if(dragging){
      const a = samples[0], b = samples[samples.length - 1];
      const v = (b.y - a.y) / Math.max(1, b.t - a.t); // px/ms, + = nach unten
      let idx;
      if(Math.abs(v) > .45) idx = SNAPS.indexOf(snap) + (v > 0 ? -1 : 1);
      else {
        let best = 0, bd = Infinity;
        SNAPS.forEach((n, i) => { const d = Math.abs(snapY(n) - sheetY); if(d < bd){ bd = d; best = i; } });
        idx = best;
      }
      setSnap(SNAPS[Math.max(0, Math.min(2, idx))]);
    }
    start = null; dragging = false;
  };
  panel.addEventListener('pointerup', end);
  panel.addEventListener('pointercancel', end);
  panel.addEventListener('click', e => { if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();
$('#grab').addEventListener('click', () => setSnap(snap === 'peek' ? 'half' : 'peek'));
mqMobile.addEventListener?.('change', () => { if(mobile()) setSnap(snap, false); else { panel.style.transform = ''; $('#attrib').style.transform = ''; panel.classList.remove('full'); } });

function show(v, snapTo){
  const changed = v !== view;

    const el = $('#' + id), on = id === v + 'View';
    el.hidden = !on;

  }
  if(snapTo) setSnap(snapTo); else if(mobile()) setSnap(snap);
  updateTrackLayers();
}

async function geoSearch(){
  const q = $('#q').value.trim(); if(!q) return;
  geoState = 'loading'; renderList();
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=${encodeURIComponent(q)}`);
    if(!r.ok) throw 0;
    geoResults = (await r.json()).map(x => {
      const parts = x.display_name.split(', ');
      return {name: x.name || parts[0], sub: parts.slice(1, 4).join(', '), lat:+x.lat, lng:+x.lon, bb:x.boundingbox};
    });
    geoState = 'done';
  }catch(e){ geoState = 'error'; }
  renderList();
}

function saveDraft(){
  syncForm();
  if(!draft.name.trim()){ editError = 'Gib dem Spot einen Namen.'; renderEdit(); $('#f-name').focus(); return; }
  const s = {...draft, name:draft.name.trim(), notes:draft.notes.trim()}; delete s.isNew;
  if(!s.walk) s.parking = null;
  if(s.parking) s.parking.note = (s.parking.note || '').trim();
  const i = data.spots.findIndex(x => x.id === s.id);
  if(i >= 0) data.spots[i] = s; else data.spots.push(s);
  if(filter.size && !filter.has(s.cat)) filter.add(s.cat);
  save(); draft = null; renderDraftMarkers(); refreshAll(); openDetail(s.id);
  toast(i >= 0 ? 'Gespeichert' : `„${s.name}“ hinzugefügt`);
}

        <button class="icon-btn" data-act="delcat" title="${used[c.id] ? `Wird von ${used[c.id]} Spot(s) genutzt` : 'Löschen'}" ${used[c.id] ? 'disabled style="opacity:.35;cursor:default"' : ''} aria-label="Kategorie löschen">${svg(UI.close,13)}</button></div>

$('#catsBtn').addEventListener('click', openCats);
$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal') return closeCats();
  const b = e.target.closest('button'); if(!b) return;
  const blk = b.closest('.catblock'), cat = blk && data.cats.find(c => c.id === blk.dataset.id);
  if(b.dataset.icon && cat){ cat.icon = b.dataset.icon; save(); renderCats(); return; }
  const a = b.dataset.act;

    const pal = ['#0ca678','#f59f00','#ae3ec9','#4263eb','#e03131','#5c940d'];
    data.cats.push({id:uid(), name:'Neue Kategorie', color:pal[data.cats.length % pal.length], icon:'pin'}); save(); renderCats();
    const inputs = $('#modal').querySelectorAll('[data-k="name"]'); const last = inputs[inputs.length-1]; last.focus(); last.select();
  }
});
$('#modal').addEventListener('input', e => {
  const blk = e.target.closest('.catblock'); if(!blk) return;
  const cat = data.cats.find(c => c.id === blk.dataset.id);
  if(e.target.dataset.k === 'name') cat.name = e.target.value.trim() || 'Ohne Namen';

function closeCats(){ $('#modal').hidden = true; refreshAll(); if(view === 'detail' && selected) renderDetail(data.spots.find(s => s.id === selected)); if(view === 'edit') refreshEditLive(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#modal').hidden) closeCats(); });

/* ================= Export / Import ================= */
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({app:'meine-spots', version:1, exported:new Date().toISOString(), ...data, tracks}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `meine-spots-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${data.spots.length} Spots exportiert`);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    if(!Array.isArray(j.spots) && !Array.isArray(j.tracks)) throw 0;
    (j.cats || []).forEach(c => { if(c && c.id && !data.cats.some(x => x.id === c.id)) data.cats.push(c); });
    let n = 0, nt = 0;
    if(Array.isArray(j.spots)){
      if(j.spots.some(s => s && !String(s.id).startsWith('bsp'))) data.spots = data.spots.filter(s => !String(s.id).startsWith('bsp'));
      j.spots.forEach(s => {
        if(!s || typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
        const i = data.spots.findIndex(x => x.id === s.id);
        if(i >= 0) data.spots[i] = s; else data.spots.push({...s, id: s.id || uid()});
        n++;
      });
    }
    if(Array.isArray(j.tracks)){
      j.tracks.forEach(t => {
        if(!t || !t.id || !Array.isArray(t.segs)) return;
        const i = tracks.findIndex(x => x.id === t.id);
        if(i >= 0) tracks[i] = t; else tracks.push(t);
        nt++;
      });
      tracks.sort((a, b) => b.created - a.created); saveTracks();
    }
    save(); refreshAll(); if(n) fitAll(); updateTrackLayers();
    toast(`${n} Spots${nt ? ` und ${nt} Strecken` : ''} importiert`);
  }catch(err){ toast('Datei konnte nicht gelesen werden. Erwartet wird ein Export aus „Meine Spots“.'); }
});

/* ================= Standort (live) ================= */
let meMarker = null, watchId = null, centerOnFix = false, lastListPos = null, meTime = 0, meAccM = 0;
/* Aktuellen Standort holen (frisch, genau) */
function getHere(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ toast('Standort wird von diesem Browser nicht unterstützt.'); return resolve(null); }
    if(me && Date.now() - meTime < 15000 && meAccM <= 50) return resolve({...me});
    toast('Standort wird ermittelt …');
    navigator.geolocation.getCurrentPosition(p => {
      onPos(p); hideToast();
      if(p.coords.accuracy > 50) toast(`Genauigkeit ca. ${Math.round(p.coords.accuracy)} m – Marker ggf. verschieben.`);
      resolve({lat:p.coords.latitude, lng:p.coords.longitude});
    }, err => {
      toast(err.code === 1 ? 'Standortzugriff verweigert. Erlaube ihn in den Einstellungen für Safari/Chrome.' : 'Standort gerade nicht verfügbar. Versuch es draußen nochmal.');
      resolve(null);
    }, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
    if(watchId == null) startGPS(false);
  });
}
async function saveHere(){
  if(view === 'edit' || mode) return;
  const btn = $('#hereBtn'); btn.disabled = true;
  const p = await getHere();
  btn.disabled = false;
  if(!p) return;
  newDraft(); draft.lat = p.lat; draft.lng = p.lng;
  showEdit();
  map.flyTo({center:LL(p), zoom:Math.max(map.getZoom(), 17), padding:camPad(), duration:1200});
  setTimeout(() => $('#f-name')?.focus(), 450);
}
$('#hereBtn').addEventListener('click', saveHere);
function startGPS(center){
  if(!navigator.geolocation){ toast('Standort wird von diesem Browser nicht unterstützt.'); return; }
  centerOnFix = center;
  if(watchId != null){ if(center && me) map.flyTo({center:LL(me), zoom:Math.max(map.getZoom(), 15), padding:camPad(), duration:1200}); return; }
  if(center) toast('Standort wird ermittelt …');
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    if(center || err.code !== 1) toast(err.code === 1 ? 'Standortzugriff verweigert. Erlaube ihn in den Einstellungen für Safari/Chrome.' : 'Standort gerade nicht verfügbar.');
    prefs.gps = false; savePrefs();
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function onPos(p){
  me = {lat:p.coords.latitude, lng:p.coords.longitude}; meTime = Date.now(); meAccM = p.coords.accuracy || 0;
  const acc = p.coords.accuracy || 0;
  if(!meMarker){
    const el = document.createElement('div'); el.className = 'me'; el.innerHTML = '<span class="p"></span><span class="d"></span>';
    meMarker = new maplibregl.Marker({element:el, anchor:'center'}).setLngLat(LL(me)).addTo(map);
  } else meMarker.setLngLat(LL(me));
  setSrc('acc', FC(acc > 5 ? [circlePoly(me, acc)] : []));
  $('#b-locate').classList.add('on');
  if(!prefs.gps){ prefs.gps = true; savePrefs(); }
  if(centerOnFix){ centerOnFix = false; hideToast(); map.flyTo({center:LL(me), zoom:Math.max(map.getZoom(), 15), padding:camPad(), duration:1400}); }
  renderNearest();
  if(!lastListPos || dist(lastListPos, me) > 25){
    lastListPos = me;
    if(view === 'list') renderList();
    if(view === 'detail' && selected){ const s = data.spots.find(x => x.id === selected); if(s){ const sc = $('#detailView .pad')?.scrollTop || 0; renderDetail(s); const pd = $('#detailView .pad'); if(pd) pd.scrollTop = sc; } }
  }
}
function renderNearest(){
  const el = $('#near');
  const list = visibleSpots();
  if(!me || !list.length || (rec && !rec.stopped)){ el.hidden = true; return; }
  let best = null, bd = Infinity;
  for(const s of list){ const d = dist(me, s); if(d < bd){ bd = d; best = s; } }
  const cat = catById(best.cat);
  el.dataset.id = best.id;
  el.innerHTML = `<span class="ic" style="--c:${cat.color}">${ic(cat.icon,15)}</span><span class="tx"><span class="l">Nächster Spot</span><span class="t">${esc(best.name)}</span></span><span class="d">${fmtDist(bd)}</span>`;
  el.hidden = false;
}
$('#near').addEventListener('click', e => { const id = e.currentTarget.dataset.id; if(id && !mode && view !== 'edit') openDetail(id, true); });
$('#b-locate').addEventListener('click', () => { if(rec && !rec.stopped) followMe = true; startGPS(true); });
$('#b-labels').addEventListener('click', () => { prefs.labels = !prefs.labels; savePrefs(); applyLabels(); });

/* ================= Helfer ================= */
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = true; void t.offsetWidth; t.hidden = false; clearTimeout(tt); tt = setTimeout(hideToast, 2800); }
function hideToast(){ $('#toast').hidden = true; }
function copy(text){
  const done = () => toast('Koordinaten kopiert');
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast(text); } ta.remove(); }
}
function refreshAll(){ renderChips(); renderList(); renderMarkers(); renderNearest(); }
function fitAll(animate){
  const pts = data.spots.flatMap(s => s.walk && s.parking ? [LL(s), LL(s.parking)] : [LL(s)]);
  if(!pts.length) return;
  const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  map.fitBounds(b, {padding:camPad(), maxZoom:14, duration: animate === false ? 0 : 1200});
}

/* ================= Strecken ================= */
const TKEY = 'meine-spots-tracks', RKEY = 'meine-spots-rec';
let tracks = [];
try{ tracks = JSON.parse(localStorage.getItem(TKEY) || '[]'); if(!Array.isArray(tracks)) tracks = []; }catch(e){ tracks = []; }
let rec = null, recWatch = null, recTick = null, wake = null, followMe = true, lastPersist = 0;
let tab = 'spots', selTrack = null, trackRenaming = false, trackDelArmed = false, discardArmed = false;

function saveTracks(){
  try{ localStorage.setItem(TKEY, JSON.stringify(tracks)); return true; }
  catch(e){ toast('Speicher voll. Exportiere deine Daten und lösche alte Strecken.'); return false; }
}
function persistRec(force){
  if(!rec) { try{ localStorage.removeItem(RKEY); }catch(e){} return; }
  if(!force && Date.now() - lastPersist < 4000) return;
  lastPersist = Date.now(); rec.lastSeen = Date.now();
  try{ localStorage.setItem(RKEY, JSON.stringify(rec)); }catch(e){}
}
const recElapsed = () => rec ? rec.active + (rec.runFrom ? Date.now() - rec.runFrom : 0) : 0;
const fmtKm = m => m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(2).replace('.', ',')} km`;
const fmtDur = ms => { const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`; };
const fmtDurLong = ms => { const m = Math.round(ms/60000); return m < 60 ? `${m} Min` : `${Math.floor(m/60)} h ${m%60} Min`; };
const fmtSpd = v => `${(v*3.6).toFixed(1).replace('.', ',')} km/h`;
const fmtDate = ts => new Date(ts).toLocaleString('de-DE', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const segFeatures = (segs, props = {}) => segs.filter(sg => sg.length > 1).map(sg => ({type:'Feature', properties:props, geometry:{type:'LineString', coordinates:sg.map(q => [q[0], q[1]])}}));

/* Tabs */
function setTab(t){
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
  $('#spotsHead').hidden = t !== 'spots';
  $('#tracksHead').hidden = t !== 'tracks';
  $('#spotActions').hidden = t !== 'spots';
  if(t === 'tracks') renderTracksHead();
  renderList(); updateTrackLayers();
  if(mobile()) setSnap(snap);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b && b.dataset.tab !== tab) setTab(b.dataset.tab); });

/* Kartenlinien */
function updateTrackLayers(){
  if(!mapReady) return;
  const showAll = (tab === 'tracks' && view === 'list') || view === 'track';
  setSrc('track-all', FC(showAll ? tracks.filter(t => t.id !== selTrack).flatMap(t => segFeatures(t.segs, {id:t.id})) : []));
  const t = view === 'track' && tracks.find(x => x.id === selTrack);
  if(t){
    const segs = t.segs.filter(sg => sg.length);
    const first = segs[0][0], lastSeg = segs[segs.length - 1], last = lastSeg[lastSeg.length - 1];
    setSrc('track-view', FC(segFeatures(t.segs)));
    setSrc('track-ends', FC([{type:'Feature', properties:{k:'start'}, geometry:{type:'Point', coordinates:[first[0], first[1]]}},
                             {type:'Feature', properties:{k:'end'}, geometry:{type:'Point', coordinates:[last[0], last[1]]}}]));
  } else { setSrc('track-view', FC([])); setSrc('track-ends', FC([])); }
}
function drawLive(){ setSrc('track-live', FC(rec ? segFeatures(rec.segs) : [])); }

/* Aufzeichnung */
async function requestWake(){ try{ if(navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener?.('release', () => { wake = null; }); } }catch(e){ wake = null; } }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && rec && rec.runFrom) requestWake(); });
function startWatch(){
  if(recWatch != null) return;
  recWatch = navigator.geolocation.watchPosition(onRecPos, err => {
    if(err.code === 1){ toast('Standortzugriff verweigert. Ohne Standort kann nichts aufgezeichnet werden.'); pauseRec(); }
  }, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}
function stopWatch(){ if(recWatch != null){ navigator.geolocation.clearWatch(recWatch); recWatch = null; } }
function startTick(){ clearInterval(recTick); recTick = setInterval(updateRecUI, 1000); }

function startRec(){
  if(!navigator.geolocation){ toast('Standort wird von diesem Browser nicht unterstützt.'); return; }
  if(rec && rec.stopped){ openTrackSave(); return; }
  if(rec) return;
  rec = {id:uid(), start:Date.now(), segs:[[]], dist:0, active:0, runFrom:Date.now(), maxSpd:0, last:null, weak:false};
  followMe = true;
  startWatch(); startGPS(false); requestWake(); startTick();
  persistRec(true); renderTracksHead(); updateRecUI(); renderNearest();
  if(mobile()) setSnap('peek');
  toast('Aufzeichnung läuft');
}
function pauseRec(){
  if(!rec || !rec.runFrom) return;
  rec.active += Date.now() - rec.runFrom; rec.runFrom = null; rec.last = null;
  stopWatch(); releaseWake();
  persistRec(true); renderTracksHead(); updateRecUI();
}
function resumeRec(){
  if(!rec || rec.runFrom || rec.stopped) return;
  if(rec.segs[rec.segs.length - 1].length) rec.segs.push([]);
  rec.runFrom = Date.now(); rec.last = null; followMe = true;
  startWatch(); requestWake(); startTick();
  persistRec(true); renderTracksHead(); updateRecUI();
}
function stopRec(){
  if(!rec || rec.stopped) return;
  if(rec.runFrom){ rec.active += Date.now() - rec.runFrom; rec.runFrom = null; }
  stopWatch(); releaseWake(); clearInterval(recTick);
  const pts = rec.segs.reduce((n, sg) => n + sg.length, 0);
  if(pts < 2){
    rec = null; persistRec(true); drawLive();
    toast('Strecke zu kurz – nichts gespeichert.');
  } else {
    rec.stopped = true; persistRec(true);
    if(view !== 'edit' && !mode) openTrackSave(); else toast('Aufzeichnung beendet – speichere sie unter „Strecken“.');
  }
  renderTracksHead(); updateRecUI(); renderNearest();
}
function onRecPos(p){
  if(!rec || !rec.runFrom) return;
  const c = p.coords, ts = p.timestamp || Date.now();
  if(c.accuracy > 35){ if(!rec.weak){ rec.weak = true; updateRecUI(); } return; }
  if(rec.weak){ rec.weak = false; updateRecUI(); }
  const pt = {lat:c.latitude, lng:c.longitude};
  if(rec.last){
    const d = dist(rec.last, pt), dt = (ts - rec.last.ts) / 1000;
    if(d < Math.max(5, c.accuracy * .4)) return;
    if(dt > 0 && d / dt > 70) return; // GPS-Sprung
    rec.dist += d;
    const spd = (c.speed != null && c.speed >= 0) ? c.speed : (dt >= 2 ? d / dt : 0);
    if(spd > rec.maxSpd && c.accuracy <= 20) rec.maxSpd = spd;
  }
  rec.segs[rec.segs.length - 1].push([+pt.lng.toFixed(6), +pt.lat.toFixed(6), Math.round((ts - rec.start) / 100) / 10]);
  rec.last = {...pt, ts};
  drawLive(); persistRec(); updateRecUI();
  if(followMe && mapReady && !map.isMoving()) map.easeTo({center:LL(pt), padding:camPad(), duration:900});
}
map.on('dragstart', () => { followMe = false; });
map.on('zoomstart', e => { if(e.originalEvent) followMe = false; });

function updateRecUI(){
  const bar = $('#recbar'), active = rec && !rec.stopped;
  bar.hidden = !active;
  if(!active) return;
  bar.classList.toggle('paused', !rec.runFrom);
  const t = fmtDur(recElapsed()), d = fmtKm(rec.dist);
  document.querySelectorAll('[data-rt]').forEach(el => el.textContent = t);
  document.querySelectorAll('[data-rd]').forEach(el => el.textContent = rec.runFrom ? (rec.weak ? 'GPS schwach …' : d) : `${d} · Pause`);
  document.querySelectorAll('[data-rec="toggle"]').forEach(b => {
    const st = rec.runFrom ? 'run' : 'pause';
    if(b.dataset.st !== st){ b.dataset.st = st; b.innerHTML = svg(st === 'run' ? UI.pause : UI.play, 18, 2.6); b.setAttribute('aria-label', st === 'run' ? 'Pause' : 'Fortsetzen'); }
  });
}
function renderTracksHead(){
  const h = $('#tracksHead');
  if(!rec){
    h.innerHTML = `<button class="btn rec-start" data-rec="start"><span class="rdot"></span>Aufzeichnung starten</button>
      <div class="hint">Lass den Bildschirm an. Im Hintergrund pausiert das Handy die Ortung.</div>`;
  } else if(rec.stopped){
    h.innerHTML = `<button class="btn primary" data-rec="opensave">Beendete Aufzeichnung speichern</button>`;
  } else {
    h.innerHTML = `<div class="reccard"><div class="tx"><span class="big" data-rt></span><span class="sm" data-rd></span></div>
      <button class="rb" data-rec="toggle"></button><button class="rb stop" data-rec="stop" aria-label="Aufzeichnung beenden">${svg(UI.stop, 18)}</button></div>
      <div class="hint">Lass den Bildschirm an. Im Hintergrund pausiert das Handy die Ortung.</div>`;
  }
  updateRecUI();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rec]'); if(!b) return;
  const a = b.dataset.rec;
  if(a === 'start') startRec();
  if(a === 'toggle') rec && rec.runFrom ? pauseRec() : resumeRec();
  if(a === 'stop') stopRec();
  if(a === 'opensave') openTrackSave();
});

/* Speichern */
function openTrackSave(){
  if(!rec || !rec.stopped) return;
  discardArmed = false;
  if(tab !== 'tracks') setTab('tracks');
  const def = `Strecke ${new Date(rec.start).toLocaleDateString('de-DE', {day:'numeric', month:'short'})}, ${new Date(rec.start).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}`;
  const avg = rec.active > 0 ? rec.dist / (rec.active / 1000) : 0;
  $('#trackSaveView').innerHTML = `
    <div class="top"><button class="txtbtn" data-ts="discard">Verwerfen</button><strong>Strecke speichern</strong><button class="txtbtn bold" data-ts="save">Sichern</button></div>
    <div class="pad">
      <label class="f">Name<input class="inp" id="t-name" value="${esc(def)}" maxlength="80"></label>
      <div class="tstats">
        <div><b>${fmtKm(rec.dist)}</b><span>Distanz</span></div>
        <div><b>${fmtDur(rec.active)}</b><span>Dauer</span></div>
        <div><b>${fmtSpd(avg)}</b><span>Ø Tempo</span></div>
        <div><b>${fmtSpd(rec.maxSpd)}</b><span>Max. Tempo</span></div>
      </div>
      <div class="muted">Die Strecke wird nur auf diesem Gerät gespeichert.</div>
    </div>`;
  show('trackSave', 'full');
  const segs = rec.segs.filter(sg => sg.length);
  if(segs.length) fitTrack(segs);
}
$('#trackSaveView').addEventListener('click', e => {
  const b = e.target.closest('[data-ts]'); if(!b || !rec) return;
  if(b.dataset.ts === 'save'){
    const t = {id:rec.id, name:($('#t-name').value.trim() || 'Strecke'), created:rec.start, dist:Math.round(rec.dist), dur:rec.active, maxSpd:rec.maxSpd,
               segs:rec.segs.filter(sg => sg.length)};
    tracks.unshift(t);
    if(!saveTracks()){ tracks.shift(); return; }
    rec = null; persistRec(true); drawLive(); renderTracksHead();
    renderList(); toast('Strecke gespeichert'); openTrack(t.id, false);
  } else {
    if(!discardArmed){ discardArmed = true; b.textContent = 'Wirklich verwerfen?'; b.style.color = 'var(--danger)'; setTimeout(() => { if(b.isConnected){ discardArmed = false; b.textContent = 'Verwerfen'; b.style.color = ''; } }, 3500); return; }
    rec = null; persistRec(true); drawLive(); renderTracksHead(); renderNearest();
    show('list', 'half'); renderList(); toast('Aufzeichnung verworfen');
  }
});

/* Liste & Detail */
function renderTrackList(){
  const body = $('#listBody');
  if(!tracks.length){ body.innerHTML = `<div class="empty"><b>Noch keine Strecken</b>Tippe auf „Aufzeichnung starten“ und los geht’s.</div>`; return; }
  body.innerHTML = tracks.map(t => `<button class="item" data-track="${t.id}"><span class="ic" style="--c:#ff9f0a">${svg(UI.route, 16)}</span><span class="tx"><span class="t">${esc(t.name)}</span><span class="s">${fmtKm(t.dist)} · ${fmtDurLong(t.dur)} · ${fmtDate(t.created)}</span></span></button>`).join('');
}
$('#listBody').addEventListener('click', e => { const b = e.target.closest('[data-track]'); if(b) openTrack(b.dataset.track, true); });
function fitTrack(segs){
  const pts = segs.flat(); if(!pts.length) return;
  const b = pts.reduce((b, q) => b.extend([q[0], q[1]]), new maplibregl.LngLatBounds([pts[0][0], pts[0][1]], [pts[0][0], pts[0][1]]));
  requestAnimationFrame(() => map.fitBounds(b, {padding:camPad(), maxZoom:17, duration:1200}));
}
function openTrack(id, fly = true){
  const t = tracks.find(x => x.id === id); if(!t) return;
  selTrack = id; trackRenaming = false; trackDelArmed = false;
  if(tab !== 'tracks') setTab('tracks');
  renderTrackView(); show('track', mobile() && snap === 'full' ? 'full' : 'half');
  fitTrack(t.segs);
}
function closeTrack(){ selTrack = null; renderList(); show('list', 'half'); }
function renderTrackView(){
  const t = tracks.find(x => x.id === selTrack); if(!t) return;
  const avg = t.dur > 0 ? t.dist / (t.dur / 1000) : 0;
  $('#trackView').innerHTML = `
    <div class="top"><button class="txtbtn" data-tv="back">${svg(UI.back,14)} Strecken</button><button class="icon-btn press" data-tv="back" aria-label="Schließen">${svg(UI.close,14)}</button></div>
    <div class="pad">
      ${trackRenaming
        ? `<div class="row"><input class="inp" id="tv-name" value="${esc(t.name)}" maxlength="80"><button class="txtbtn bold" data-tv="renamesave">Fertig</button></div>`
        : `<div style="display:flex;flex-direction:column;gap:4px"><span class="badge" style="--c:#ff9f0a"><span class="ic">${svg(UI.route,13)}</span>Strecke</span><h2>${esc(t.name)}</h2><span class="muted">${fmtDate(t.created)}</span></div>`}
      <div class="tstats">
        <div><b>${fmtKm(t.dist)}</b><span>Distanz</span></div>
        <div><b>${fmtDur(t.dur)}</b><span>Dauer</span></div>
        <div><b>${fmtSpd(avg)}</b><span>Ø Tempo</span></div>
        <div><b>${fmtSpd(t.maxSpd || 0)}</b><span>Max. Tempo</span></div>
      </div>
      <button class="btn" data-tv="gpx">${svg(UI.share,15)} Als GPX exportieren</button>
      <div class="btns"><button class="btn" data-tv="rename">Umbenennen</button><button class="btn danger" data-tv="del">Löschen</button></div>
    </div>`;
  if(trackRenaming) setTimeout(() => { const i = $('#tv-name'); if(i){ i.focus(); i.select(); } }, 50);
}
$('#trackView').addEventListener('click', e => {
  const b = e.target.closest('[data-tv]'); if(!b) return;
  const t = tracks.find(x => x.id === selTrack); if(!t) return;
  const a = b.dataset.tv;
  if(a === 'back') closeTrack();
  if(a === 'rename'){ trackRenaming = true; renderTrackView(); }
  if(a === 'renamesave'){ t.name = $('#tv-name').value.trim() || t.name; saveTracks(); trackRenaming = false; renderTrackView(); }
  if(a === 'gpx') downloadText(`${t.name.replace(/[^\wäöüÄÖÜß -]+/g, '').trim() || 'strecke'}.gpx`, toGPX(t), 'application/gpx+xml');
  if(a === 'del'){
    if(!trackDelArmed){ trackDelArmed = true; b.classList.add('armed'); b.textContent = 'Wirklich löschen?'; setTimeout(() => { if(b.isConnected){ trackDelArmed = false; b.classList.remove('armed'); b.textContent = 'Löschen'; } }, 3500); return; }
    tracks = tracks.filter(x => x.id !== t.id); saveTracks(); selTrack = null;
    show('list', 'half'); renderList(); toast(`„${t.name}“ gelöscht`);
  }
});
$('#trackView').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'tv-name'){ e.preventDefault(); $('#trackView [data-tv="renamesave"]').click(); } });
function toGPX(t){
  const x = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Jamsis Spots" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${x(t.name)}</name>\n` +
    t.segs.map(sg => '<trkseg>\n' + sg.map(q => `<trkpt lat="${q[1]}" lon="${q[0]}"><time>${new Date(t.created + q[2] * 1000).toISOString()}</time></trkpt>`).join('\n') + '\n</trkseg>').join('\n') +
    `\n</trk>\n</gpx>\n`;
}
function downloadText(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Unterbrochene Aufzeichnung wiederherstellen */
try{
  const r = JSON.parse(localStorage.getItem(RKEY) || 'null');
  if(r && Array.isArray(r.segs)){
    rec = r; rec.last = null;
    if(!rec.stopped && rec.runFrom){ rec.active += Math.max(0, (rec.lastSeen || rec.runFrom) - rec.runFrom); rec.runFrom = null; }
  }
}catch(e){ rec = null; }

/* ================= Start ================= */
$('#addBtn').innerHTML = svg(UI.plus, 16, 2.6);
$('#hereBtn').innerHTML = svg(UI.locate, 14) + 'Hier speichern';
$('#searchIc').innerHTML = svg(UI.search, 15);
$('#b-locate').innerHTML = svg(UI.locate, 18);
$('#b-labels').innerHTML = svg(UI.labels, 18);
$('#b-3d').classList.toggle('on', !!prefs.terrain);
$('#recbar [data-rec="stop"]').innerHTML = svg(UI.stop, 16);
applyLabels(); refreshAll();
if(rec){
  setTab('tracks'); renderTracksHead(); updateRecUI(); renderNearest();
  if(rec.stopped) setTimeout(openTrackSave, 300); else toast('Aufzeichnung wiederhergestellt – pausiert. Tippe ▶ zum Fortsetzen.');
}
if(mobile()) setSnap('peek', false);
requestAnimationFrame(() => fitAll(false));
(async () => {
  let granted = prefs.gps;
  try{ const st = await navigator.permissions?.query({name:'geolocation'}); if(st) granted = st.state === 'granted' || (st.state === 'prompt' && prefs.gps); }catch(e){}
  if(granted) startGPS(false);
})();
})();
</script>
</body>
